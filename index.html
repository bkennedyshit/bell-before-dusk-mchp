    function drawObjectiveRibbon() {
      ctx.save();
      ctx.fillStyle = "#070a10b8";
      ctx.fillRect(17, 130, 326, 29);
      ctx.strokeStyle = "#b88b48b8";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(17, 130.5); ctx.lineTo(343, 130.5);
      ctx.moveTo(17, 158.5); ctx.lineTo(343, 158.5);
      ctx.stroke();
      ctx.restore();
    }

    function drawFogMeter() {
      const value = clamp(game.fog / 100, 0, 1);
      const color = game.fog >= 85 ? "#e35f59" : game.fogPhase === "surge" ? "#d3ad55" : "#69aca8";
      const state = game.fog >= 100 ? "WHITE" : game.fogPhase === "surge" ? "FRONT" : game.fogPhase === "warning" ? "WIND" : "CLEAR";
      ctx.fillStyle = "#0c1118df"; ctx.fillRect(229, 171, 123, 20);
      ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.strokeRect(229.5, 171.5, 122, 19);
      text(state, 237, 181, 6, "#d9e6df", "left", true);
      ctx.fillStyle = "#273038"; ctx.fillRect(266, 177, 55, 7);
      ctx.fillStyle = color; ctx.fillRect(267, 178, 53 * value, 5);
      text(`${Math.round(game.fog)}%`, 344, 181, 8, color, "right", true);
    }

    function drawBellMeter() {
      const value = clamp(bell.integrity / bell.maxIntegrity, 0, 1);
      const color = value < 0.35 ? "#e35f59" : "#d8b24f";
      ctx.fillStyle = "#0c1118df"; ctx.fillRect(217, 171, 135, 20);
      ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.strokeRect(217.5, 171.5, 134, 19);
      text("BELL", 225, 181, 7, "#f0ddad", "left", true);
      ctx.fillStyle = "#302c28"; ctx.fillRect(262, 177, 55, 7);
      ctx.fillStyle = color; ctx.fillRect(263, 178, 53 * value, 5);
      text(`${Math.round(bell.resonance)}%`, 344, 181, 8, "#f0cc69", "right", true);
    }

    function drawControls() {
      const controlShade = ctx.createLinearGradient(0, 540, 0, 640);
      controlShade.addColorStop(0, "#17172200");
      controlShade.addColorStop(0.48, "#11131a70");
      controlShade.addColorStop(1, "#080a10d6");
      ctx.fillStyle = controlShade;
      ctx.fillRect(0, 540, W, 100);
      drawMoveSeal();
      if (game.scene === "platform") {
        drawActionSeal(actionButton, "JUMP", "jump", "#6f5136");
        drawActionSeal(contextButton, "SLASH", "katana", "#82363d", true);
        return;
      }
      drawActionSeal(actionButton, actionLabel(), "katana", game.hasKatana ? "#82363d" : "#4b4144");
      const context = contextAction();
      if (context) {
        drawActionSeal(contextButton, context.label, "context", "#28545b", true);
      }
    }

    function drawMoveSeal() {
      if (touchControls.complete && touchControls.naturalWidth) {
        ctx.save();
        ctx.globalAlpha = 0.96;
        drawTouchControlCell(0, 0, stick.x, stick.y, 82);
        drawTouchControlCell(1, 0, stick.x + stick.dx * 19, stick.y + stick.dy * 19, 82);
        ctx.restore();
        return;
      }
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = "#05070aa8"; ctx.beginPath(); ctx.arc(stick.x + 2, stick.y + 3, stick.r + 2, 0, Math.PI * 2); ctx.fill();
      const ring = ctx.createRadialGradient(stick.x - 8, stick.y - 9, 4, stick.x, stick.y, stick.r);
      ring.addColorStop(0, "#45454a"); ring.addColorStop(0.72, "#171b22"); ring.addColorStop(1, "#080a0e");
      ctx.fillStyle = ring; ctx.beginPath(); ctx.arc(stick.x, stick.y, stick.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#b89051"; ctx.lineWidth = 3; ctx.stroke();
      ctx.strokeStyle = "#604a2d"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(stick.x, stick.y, stick.r - 7, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 4; i++) {
        const angle = i * Math.PI / 2;
        ctx.strokeStyle = "#d7b66b"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(stick.x + Math.cos(angle) * 27, stick.y + Math.sin(angle) * 27);
        ctx.lineTo(stick.x + Math.cos(angle) * 31, stick.y + Math.sin(angle) * 31); ctx.stroke();
      }
      const knobX = stick.x + stick.dx * 19, knobY = stick.y + stick.dy * 19;
      const knob = ctx.createRadialGradient(knobX - 5, knobY - 6, 2, knobX, knobY, 17);
      knob.addColorStop(0, "#8a8580"); knob.addColorStop(0.35, "#4c4a4d"); knob.addColorStop(1, "#17181d");
      ctx.fillStyle = knob; ctx.beginPath(); ctx.arc(knobX, knobY, 16, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#0a0b0e"; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }

    function drawActionSeal(button, label, icon, color, small = false) {
      const radius = small ? button.r : button.r;
      if (touchControls.complete && touchControls.naturalWidth) {
        let column = 2, row = 0;
        if (icon === "jump") { column = 0; row = 1; }
        else if (icon === "context") {
          const doorway = /ENTER|EXIT|TOWN|CHASE|RETURN/.test(label);
          column = doorway ? 2 : 1;
          row = 1;
        }
        ctx.save();
        ctx.globalAlpha = game.hasKatana || icon !== "katana" ? 0.97 : 0.62;
        const pressedScale = button.down ? 0.93 : 1;
        drawTouchControlCell(column, row, button.x, button.y, radius * 2.38 * pressedScale);
        ctx.restore();
        text(label, button.x, button.y + (small ? 12 : 16), small ? 7 : 8, "#fff1d2", "center", true);
        return;
      }
      ctx.save();
      ctx.globalAlpha = 0.93;
      ctx.fillStyle = "#05070ab8"; ctx.beginPath(); ctx.arc(button.x + 2, button.y + 3, radius + 2, 0, Math.PI * 2); ctx.fill();
      const lacquer = ctx.createRadialGradient(button.x - 8, button.y - 10, 2, button.x, button.y, radius);
      lacquer.addColorStop(0, button.down ? "#e2bd70" : "#ad6960");
      lacquer.addColorStop(0.46, button.down ? "#9b7442" : color);
      lacquer.addColorStop(1, "#281d22");
      ctx.fillStyle = lacquer; ctx.beginPath(); ctx.arc(button.x, button.y, radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#d4ad61"; ctx.lineWidth = small ? 2 : 3; ctx.stroke();
      ctx.strokeStyle = "#6f532f"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(button.x, button.y, radius - 6, 0, Math.PI * 2); ctx.stroke();
      if (icon === "katana") {
        ctx.translate(button.x, button.y - (small ? 7 : 10)); ctx.rotate(-0.65);
        ctx.fillStyle = "#f7ebcf"; ctx.fillRect(-2, small ? -11 : -15, 4, small ? 22 : 28);
        ctx.fillStyle = "#d8aa4a"; ctx.fillRect(small ? -6 : -8, small ? 9 : 11, small ? 12 : 16, 3);
      } else if (icon === "jump") {
        ctx.strokeStyle = "#fff0cf"; ctx.lineWidth = small ? 3 : 4;
        ctx.beginPath(); ctx.moveTo(button.x - 11, button.y - 3); ctx.lineTo(button.x, button.y - 15); ctx.lineTo(button.x + 11, button.y - 3); ctx.stroke();
      }
      ctx.restore();
      text(label, button.x, button.y + (small ? 12 : 15), small ? 7 : 8, "#fff1d2", "center", true);
    }

    function drawTouchControlCell(column, row, x, y, size) {
      const sourceWidth = touchControls.naturalWidth / 3;
      const sourceHeight = touchControls.naturalHeight / 2;
      ctx.drawImage(
        touchControls,
        column * sourceWidth, row * sourceHeight, sourceWidth, sourceHeight,
        x - size / 2, y - size / 2, size, size
      );
    }

    function actionLabel() {
      if (game.scene === "platform") return "JUMP";
      return game.hasKatana ? "SLASH" : "LOCKED";
    }

    function drawMistBands(alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      for (let i = 0; i < 8; i++) {
        const y = ((i * 93 + game.elapsed * (7 + i)) % (H + 100)) - 50;
        const gradient = ctx.createLinearGradient(0, y - 35, 0, y + 35);
        gradient.addColorStop(0, "#d8e4df00");
        gradient.addColorStop(0.5, "#d8e4df");
        gradient.addColorStop(1, "#d8e4df00");
        ctx.fillStyle = gradient;
        ctx.fillRect(-20, y - 35, W + 40, 70);
      }
      ctx.restore();
    }

    function drawRepair() {
      drawUiMenuSkin();
      drawBellGraphic(61, 98, 0.5);
      text("WARD-BELL WORK", 220, 34, 18, "#f2d896", "center", true);
      text("BUILD ONE UPGRADE", 220, 57, 9, "#bcae94", "center", true);
      text(`CEDAR ${game.cedar}`, 155, 92, 12, "#efd07d", "center", true);
      text(`SPIRIT ASH ${game.ash}`, 257, 92, 12, "#91ddd3", "center", true);
      text("CEDAR FORMS IT  •  ASH SEALS IT", 180, 151, 9, "#ead6a4", "center", true);
      drawRepairCard(game.upgradeOptions[0], 187, 0);
      drawRepairCard(game.upgradeOptions[1], 367, 1);
      text("CHOOSE A REPAIR TO CONTINUE", 180, 584, 11, "#f1ddb0", "center", true);
    }

    function drawRepairCard(option, y, index) {
      const canAfford = game.cedar >= option.cedar && game.ash >= option.ash;
      if (!uiSkin.complete || !uiSkin.naturalWidth) panel(24, y, 312, 160, canAfford ? "#293131" : "#29252c", canAfford ? "#d0a957" : "#625a60");
      text(`${index + 1}. ${option.name}`, 48, y + 34, 16, canAfford ? "#ffe9b4" : "#8d8587", "left", true);
      text(canAfford ? "READY" : "NEED MATERIAL", 310, y + 34, 8, canAfford ? "#9ee0b1" : "#a98282", "right", true);
      fitText(option.detail, 180, y + 78, 12, canAfford ? "#e6ded0" : "#847c7e", 270);
      text(`${option.cedar} CEDAR FIBER`, 55, y + 119, 10, canAfford ? "#e5c471" : "#7e7478", "left", true);
      text(`${option.ash} SPIRIT ASH`, 305, y + 119, 10, canAfford ? "#8dd9d0" : "#7e7478", "right", true);
      text("TAP CARD TO BUILD", 180, y + 144, 7, canAfford ? "#b9ad94" : "#6f6768", "center", true);
    }

    function drawShop() {
      drawUiMenuSkin();
      drawCitizenWalkCell(5, 0, 61, 108, 74, false);
      text("SPARROW FORGE", 220, 35, 18, "#f6dfaa", "center", true);
      text("STEEL  •  CHARMS", 220, 58, 9, "#c8b291", "center", true);
      drawResourcePip(193, 93, "mon");
      text(`${game.mon} MON`, 210, 94, 13, "#f0cf7c", "left", true);
      text("YOKAI AND PATH GUARDS CARRY MON", 180, 151, 8, "#c9b68d", "center", true);
      const options = shopOptions();
      drawShopCard(options[0], 187, 0);
      drawShopCard(options[1], 367, 1);
      text("BACK TO FORGE", 180, 584, 13, "#fff0ca", "center", true);
    }

    function drawShopCard(option, y, index) {
      const owned = (option.oneTime && game.shopOwned.includes(option.id)) || (option.id === "smoke" && game.smokeCharm);
      const available = !owned && game.mon >= option.mon;
      if (!uiSkin.complete || !uiSkin.naturalWidth) panel(22, y, 316, 160, available ? "#343d36" : "#2b262a", available ? "#d1ac58" : "#675b5d");
      text(`${index + 1}. ${option.name}`, 48, y + 35, 15, available ? "#ffe5a8" : "#aaa09d", "left", true);
      text(owned ? "OWNED" : available ? "AVAILABLE" : "TOO POOR", 310, y + 35, 8, available ? "#9ee0b1" : "#927f7a", "right", true);
      fitText(owned ? "Purchased for this session" : option.detail, 180, y + 81, 12, available ? "#e7ded0" : "#8f8685", 270);
      text(`${option.mon} MON`, 180, y + 124, 12, available ? "#e5c369" : "#8a7b69", "center", true);
      text("TAP CARD TO BUY", 180, y + 146, 7, available ? "#b9ad94" : "#6f6768", "center", true);
    }

    function drawPlatform() {
      const p = game.platform;
      ctx.fillStyle = "#101526";
      ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.translate(-p.camera * 0.55, 0);
      if (spiritPathBackdrop.complete && spiritPathBackdrop.naturalWidth) {
        ctx.drawImage(
          spiritPathBackdrop,
          0, 0, spiritPathBackdrop.naturalWidth, spiritPathBackdrop.naturalHeight,
          -80, 82, 1500, 500
        );
      } else {
        const sky = ctx.createLinearGradient(0, 92, 960, 430);
        sky.addColorStop(0, "#b85f4f"); sky.addColorStop(0.5, "#535582"); sky.addColorStop(1, "#17243b");
        ctx.fillStyle = sky; ctx.fillRect(0, 92, 960, 340);
      }
      ctx.restore();

      ctx.save();
      ctx.translate(-p.camera, 0);
      drawSpiritPathTerrain();
      for (const goon of p.goons) if (!goon.dead) drawPlatformBandit(goon.x, goon.y, goon.thief, goon);
      if (!(game.hero.invulnerable > 0 && Math.floor(game.hero.invulnerable * 16) % 2)) {
        const moving = Math.abs(p.vx) > 1;
        const column = p.slash > 0 ? 3 : moving ? 1 : 0;
        if (p.grounded) {
          const ground = p.y + 18;
          drawGroundShadow(p.x, ground, 14, 0.46);
          drawHeroCell(column, 3, p.x, ground, 72, (p.facing || 1) < 0);
        } else {
          ctx.save();
          ctx.translate(p.x, p.y + 18);
          ctx.rotate((p.vy < 0 ? -0.11 : 0.09) * (p.facing || 1));
          ctx.scale(1.04, 0.96);
          drawHeroCell(p.slash > 0 ? 3 : 0, 3, 0, 0, 72, (p.facing || 1) < 0);
          ctx.restore();
          if (p.slash > 0) drawAirSlashArc(p);
        }
      }
      ctx.restore();
      drawHud();
      drawControls();
    }

    function drawAirSlashArc(p) {
      ctx.save();
      ctx.translate(p.x + (p.facing || 1) * 22, p.y - 7);
      if ((p.facing || 1) < 0) ctx.scale(-1, 1);
      ctx.globalAlpha = clamp(p.slash / 0.28, 0.2, 1);
      ctx.strokeStyle = "#fff1c8";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, 26, -1.05, 1.0);
      ctx.stroke();
      ctx.strokeStyle = "#d7a64c";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 31, -0.96, 0.88);
      ctx.stroke();
      ctx.restore();
    }

    function drawSpiritPathTerrain() {
      for (const segment of SPIRIT_SEGMENTS) drawSpiritTerrainSegment(segment);
    }

    function drawSpiritTerrainSegment(segment) {
      const { start, end, y0, y1, art } = segment;
      const width = end - start;
      if (spiritTerrainSheet.complete && spiritTerrainSheet.naturalWidth) {
        const cellWidth = spiritTerrainSheet.naturalWidth / 4;
        const specs = [
          { sy: 275, sh: 280, height: 164, contactOffset: 28 },
          { sy: 270, sh: 285, height: 174, contactOffset: 31 },
          { sy: 260, sh: 300, height: 190, contactOffset: 32 },
          { sy: 170, sh: 390, height: 210, contactOffset: 70 }
        ];
        const spec = specs[art];
        const highGround = Math.min(y0, y1);
        ctx.drawImage(
          spiritTerrainSheet,
          art * cellWidth, spec.sy, cellWidth, spec.sh,
          start - 8, highGround - spec.contactOffset, width + 16, spec.height
        );
        return;
      }
    }

    function drawPlatformBandit(x, y, thief = false, goon = null) {
      if (!pathEnemyAtlas) return;
      drawGroundShadow(x, y, thief ? 16 : 14, 0.46);
      const frame = goon?.telegraph > 0 ? 2 : Math.floor(game.elapsed * 8 + x * 0.025) % 2;
      drawPathEnemyCell(goon?.variant ?? (thief ? 2 : 0), frame, x, y + 3, thief ? 78 : 74, goon ? goon.dir < 0 : false);
      if (goon?.telegraph > 0) {
        ctx.fillStyle = "#e45b4e";
        ctx.fillRect(x - 2, y - 55, 4, 12);
        ctx.fillRect(x - 2, y - 39, 4, 4);
        ctx.strokeStyle = "#ffca77"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y - 47, 10 + Math.sin(game.elapsed * 18) * 2, 0, Math.PI * 2); ctx.stroke();
      }
      if (goon?.thief) {
        ctx.fillStyle = "#de574e";
        ctx.beginPath(); ctx.moveTo(x, y - 63); ctx.lineTo(x - 7, y - 75); ctx.lineTo(x + 7, y - 75); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#251d22"; ctx.fillRect(x - 19, y - 57, 38, 4);
        ctx.fillStyle = "#ef695c"; ctx.fillRect(x - 19, y - 57, 38 * goon.hp / goon.maxHp, 4);
      }
    }

    function drawOutcome() {
      const won = game.outcome === "victory";
      const fogDefeat = !won && game.defeatCause === "fog";
      const pathDefeat = !won && (game.defeatCause === "path" || game.defeatCause === "ravine");
      const heading = won ? "THE BELL HOLDS"
        : fogDefeat ? "LOST IN THE FOG"
          : pathDefeat ? "THE PATH CLAIMS YOU"
            : game.defeatCause === "yokai" ? "YOKAI PREVAIL"
              : game.defeatCause === "defender" ? "THE DEFENDER FALLS" : "THE BELL FALLS";
      const reason = won ? "The town gets dinner without demons."
        : fogDefeat ? "A full-pressure fog front took Yusuke's last breath."
          : game.defeatCause === "ravine" ? "The ravine mist exhausted Yusuke before he recovered the clapper."
            : game.defeatCause === "path" ? "A path guard ended the clapper pursuit."
              : game.defeatCause === "yokai" ? "A field yokai ended the supply run."
                : game.defeatCause === "defender" ? "Yusuke fell while defending the ward bell." : "The gate yokai shattered the town's ward bell.";
      drawUiMenuSkin();
      text(heading, 220, 36, heading.length > 18 ? 17 : 21, won ? "#f6dc83" : "#ef8b86", "center", true);
      text(won ? "RUN COMPLETE" : "EXPEDITION ENDED", 220, 61, 8, "#b9ab94", "center", true);
      text(`SCORE  ${game.score}`, 220, 95, 15, "#fff0c5", "center", true);
      wrappedText(reason, 180, 151, 290, 13, 10, "#eee4d6", 2);
      text("RUN CONDITION", 180, 217, 10, "#b9a379", "center", true);
      text(`HERO HEALTH`, 58, 258, 9, "#9d907e", "left", true);
      text(`${Math.max(0, Math.round(game.hero.hp))} / ${game.hero.maxHp}`, 302, 258, 15, "#e4d8c4", "right", true);
      text(`BELL INTEGRITY`, 58, 301, 9, "#9d907e", "left", true);
      text(`${Math.max(0, Math.round(bell.integrity))} / ${bell.maxIntegrity}`, 302, 301, 15, "#e4d8c4", "right", true);
      text(`WARD RESONANCE`, 58, 334, 9, "#9d907e", "left", true);
      text(`${Math.round(bell.resonance)}%`, 302, 334, 15, "#efd07a", "right", true);
      text("INSTALLED REPAIRS", 180, 399, 10, "#b9a379", "center", true);
      if (game.upgrades.length) {
        text(game.upgrades[0], 180, 449, 14, "#efd795", "center", true);
        if (game.upgrades[1]) text(game.upgrades[1], 180, 486, 14, "#efd795", "center", true);
      } else text("None installed", 180, 464, 13, "#aaa094", "center");
      if (fogDefeat) text(`FOG PRESSURE  ${Math.round(game.fog)}%`, 180, 516, 10, "#ef8b86", "center", true);
      text("TAP TO TRY AGAIN", 180, 584, 16, "#fff3d4", "center", true);
    }

    function drawMessage() {
      ctx.save();
      ctx.globalAlpha = clamp(messageTime * 2, 0, 1);
      const runState = game.phase === "run1" || game.phase === "run2" || game.phase === "breach";
      const x = 55;
      const width = 250;
      const maxWidth = 212;
      const maxLines = game.scene === "shop" ? 3 : 4;
      const lines = wrappedTextLines(message, maxWidth, 11, maxLines);
      const height = 21 + lines.length * 16;
      const y = game.scene === "repair" ? H - height - 20 : game.scene === "shop" ? 150 : runState ? 215 : 199;
      ctx.fillStyle = "#070a10bd";
      ctx.fillRect(x, y, width, height);
      ctx.strokeStyle = "#bd9251c7";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, y + 0.5); ctx.lineTo(x + width, y + 0.5);
      ctx.moveTo(x, y + height - 0.5); ctx.lineTo(x + width, y + height - 0.5);
      ctx.stroke();
      ctx.fillStyle = "#873735"; ctx.fillRect(x + 10, y + 8, 3, height - 16);
      text("NOTICE", x + 20, y + 11, 7, "#e7c571", "left", true);
      ctx.font = "11px Georgia";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff4df";
      lines.forEach((item, index) => ctx.fillText(item, 180, y + 27 + index * 16));
      ctx.restore();
    }

    function panel(x, y, width, height, fill, stroke) {
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, width, height);
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, width - 2, height - 2);
    }

    function text(value, x, y, size, color, align = "left", bold = false) {
      ctx.font = `${bold ? "bold " : ""}${size}px Georgia`;
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.fillStyle = color;
      ctx.fillText(value, x, y);
    }

    function fitText(value, x, y, size, color, width) {
      ctx.font = `${size}px Georgia`;
      while (ctx.measureText(value).width > width && size > 8) {
        size--;
        ctx.font = `${size}px Georgia`;
      }
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = color;
      ctx.fillText(value, x, y);
    }

    function wrappedTextLines(value, maxWidth, size, maxLines = 3) {
      ctx.font = `${size}px Georgia`;
      const words = value.split(/\s+/);
      const lines = [];
      let line = "";
      for (const word of words) {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
          if (lines.length === maxLines - 1) break;
        } else line = test;
      }
      const consumed = lines.join(" ").split(/\s+/).filter(Boolean).length;
      if (lines.length < maxLines) {
        const remaining = words.slice(consumed).join(" ");
        if (remaining) lines.push(remaining);
      }
      if (lines.length > maxLines) lines.length = maxLines;
      const last = lines.length - 1;
      if (last >= 0 && ctx.measureText(lines[last]).width > maxWidth) {
        while (lines[last].length > 3 && ctx.measureText(`${lines[last]}…`).width > maxWidth) lines[last] = lines[last].slice(0, -1);
        lines[last] += "…";
      }
      return lines;
    }

    function wrappedText(value, x, startY, maxWidth, lineHeight, size, color, maxLines = 3) {
      const lines = wrappedTextLines(value, maxWidth, size, maxLines);
      ctx.font = `${size}px Georgia`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = color;
      lines.forEach((item, index) => ctx.fillText(item, x, startY + index * lineHeight));
    }

    function bar(x, y, width, height, ratio, color, label) {
      text(label, x, y - 5, 8, "#b8ad9c", "left", true);
      ctx.fillStyle = "#332c30";
      ctx.fillRect(x, y, width, height);
      ctx.fillStyle = color;
      ctx.fillRect(x, y, width * clamp(ratio, 0, 1), height);
    }

    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000 || 0);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  })();
  </script>
