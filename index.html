<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#171722">
  <title>Bell Before Dusk — Prototype</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101018; }
    body { display: grid; place-items: center; font-family: Georgia, "Times New Roman", serif; touch-action: none; }
    #frame {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      overflow: hidden;
      background: #171722;
      box-shadow: 0 0 0 1px #3c3945, 0 18px 80px #000b;
    }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 10; place-items: center;
      padding: 32px; text-align: center; background: #16141d; color: #f5e8c8; font-size: 20px;
    }
    @media (orientation: landscape) and (max-height: 540px) { #rotate { display: grid; } }
  </style>
</head>
<body>
  <div id="frame"><canvas id="game" width="360" height="640" aria-label="Bell Before Dusk game"></canvas></div>
  <div id="rotate">Bell Before Dusk is designed for portrait orientation.</div>
  <script>
  (() => {
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d", { alpha: false });
    ctx.imageSmoothingEnabled = false;
    const heroSheet = new Image();
    heroSheet.src = "assets/hero/samurai-courier-sprites-v2.png";
    const townPanorama = new Image();
    townPanorama.src = "assets/environment/post-town-open-v4.png";
    const spiritPathBackdrop = new Image();
    spiritPathBackdrop.src = "assets/environment/spirit-path-platform-v2.png";
    const spiritTerrainSheet = new Image();
    spiritTerrainSheet.src = "assets/environment/spirit-path-terrain-v6-clean.png";
    const outsideBackdrop = new Image();
    outsideBackdrop.src = "assets/environment/haunted-field-open-v2.png";
    const citizenWalkSheet = new Image();
    let citizenWalkAtlas = null;
    citizenWalkSheet.addEventListener("load", () => { citizenWalkAtlas = buildTransparentCitizenAtlas(citizenWalkSheet); });
    citizenWalkSheet.src = "assets/characters/edo-citizens-sidewalk-v2.png";
    const citizenPortraitSheet = new Image();
    let citizenPortraitAtlas = null;
    citizenPortraitSheet.addEventListener("load", () => { citizenPortraitAtlas = buildTransparentCitizenAtlas(citizenPortraitSheet); });
    citizenPortraitSheet.src = "assets/characters/edo-citizens-v1.png";
    const citizenVerticalSheet = new Image();
    let citizenVerticalAtlas = null;
    citizenVerticalSheet.addEventListener("load", () => {
      citizenVerticalAtlas = buildTransparentCitizenAtlas(citizenVerticalSheet);
      const cellHeight = Math.floor(citizenVerticalAtlas.height / 4);
      citizenVerticalAtlas.getContext("2d").clearRect(
        0,
        cellHeight * 3 - 18,
        citizenVerticalAtlas.width,
        18
      );
    });
    citizenVerticalSheet.src = "assets/characters/edo-citizens-verticalwalk-v1.png";
    const banditWalkSheet = new Image();
    let banditWalkAtlas = null;
    banditWalkSheet.addEventListener("load", () => { banditWalkAtlas = buildTransparentCitizenAtlas(banditWalkSheet); });
    banditWalkSheet.src = "assets/characters/edo-citizens-walk-v1.png";
    const pathEnemySheet = new Image();
    let pathEnemyAtlas = null;
    pathEnemySheet.addEventListener("load", () => { pathEnemyAtlas = buildTransparentCitizenAtlas(pathEnemySheet); });
    pathEnemySheet.src = "assets/characters/spirit-path-enemies-v1.png";
    const yokaiSheet = new Image();
    let yokaiAtlas = null;
    yokaiSheet.addEventListener("load", () => { yokaiAtlas = buildTransparentCitizenAtlas(yokaiSheet); });
    yokaiSheet.src = "assets/characters/edo-yokai-atlas-v3.png";
    const innInterior = new Image();
    innInterior.src = "assets/environment/crooked-carp-interior-v1.png";
    const forgeInterior = new Image();
    forgeInterior.src = "assets/environment/sparrow-forge-interior-v1.png";
    const uiSkin = new Image();
    uiSkin.src = "assets/ui/edo-ui-skin-v1.png";
    const touchControls = new Image();
    touchControls.src = "assets/ui/edo-touch-controls-v1.png";
    const titleBackdrop = new Image();
    titleBackdrop.src = "assets/ui/title-town-dusk-v2.png";
    const titleButtonFrame = new Image();
    titleButtonFrame.src = "assets/ui/title-begin-frame-v1.png";

    const W = 360;
    const H = 640;
    const WORLD_H = 1200;
    const TOWN_W = 1080;
    const TOWN_Y = 480;
    const FIELD_W = 720;
    const FIELD_H = 1080;
    const CAMERA_ZOOM = 1.14;
    const SPIRIT_WORLD_W = 1320;
    const SPIRIT_SEGMENTS = [
      { start: 0, end: 220, y0: 500, y1: 500, art: 0 },
      { start: 250, end: 430, y0: 520, y1: 455, art: 2 },
      { start: 455, end: 670, y0: 455, y1: 455, art: 1 },
      { start: 705, end: 900, y0: 520, y1: 445, art: 3 },
      { start: 925, end: 1105, y0: 490, y1: 490, art: 0 },
      { start: 1135, end: 1310, y0: 450, y1: 450, art: 1 }
    ];
    const keys = new Set();
    const stick = { active: false, id: null, x: 57, y: 582, dx: 0, dy: 0, r: 36 };
    const actionButton = { x: 304, y: 580, r: 37, down: false, id: null };
    const contextButton = { x: 300, y: 506, r: 27, down: false, id: null };
    const musicButton = { x: 342, y: 177, r: 18 };
    const official = { x: 540, y: 828 };
    const bell = { x: 965, y: 650, integrity: 100, maxIntegrity: 100, resonance: 0 };
    const townGate = { x: 540, y: 620 };
    const outsideGate = { x: 360, y: 970 };
    const sealedGate = { x: 360, y: 112 };
    const spiritTrail = { x: 620, y: 150 };
    const innDoor = { x: 260, y: 695 };
    const smithDoor = { x: 830, y: 695 };
    const innLanding = { x: 260, y: 735 };
    const smithLanding = { x: 830, y: 735 };
    const innkeeper = { x: 180, y: 350 };
    const smithkeeper = { x: 180, y: 283 };

    let audio = null;
    let music = null;
    let musicTrack = "";
    let musicMuted = false;
    let musicFade = 0;
    let musicDangerHold = 0;
    let last = performance.now();
    let cameraX = 360;
    let cameraY = WORLD_H - H;
    let screenShake = 0;
    let message = "";
    let messageTime = 0;
    let objectiveTime = 0;
    let particles = [];

    const game = {
      scene: "title",
      phase: "town_intro",
      run: 0,
      elapsed: 0,
      score: 0,
      cedar: 0,
      ash: 0,
      mon: 0,
      fog: 0,
      runFogMod: 1,
      fogWarning: 0,
      fogPainClock: 0,
      fogPhase: "clear",
      fogPhaseClock: 0,
      fogFront: 0,
      hasKatana: false,
      banditFled: false,
      chaseComplete: false,
      outsideVisited: false,
      objective: "",
      upgrades: [],
      upgradeOptions: [],
      spawnClock: 0,
      breachTime: 0,
      bossSpawned: false,
      bossDefeated: false,
      ringCooldown: 0,
      outcome: "",
      defeatCause: "",
      tapTarget: null,
      mapId: "town",
      pendingRun: 0,
      returnPoint: null,
      returnObjective: "",
      doorCooldown: 0,
      shopOwned: [],
      smokeCharm: false,
      hero: null,
      enemies: [],
      nodes: [],
      platform: null,
      residents: []
    };

    function resetGame() {
      Object.assign(game, {
        scene: "topdown", phase: "town_intro", run: 0, elapsed: 0, score: 0,
        cedar: 0, ash: 0, mon: 0, fog: 0, runFogMod: 1, fogWarning: 0, fogPainClock: 0,
        fogPhase: "clear", fogPhaseClock: 0, fogFront: 0, hasKatana: false,
        banditFled: false, chaseComplete: false, outsideVisited: false, upgrades: [], upgradeOptions: [],
        spawnClock: 0, breachTime: 0, bossSpawned: false, bossDefeated: false,
        ringCooldown: 0, outcome: "", defeatCause: "", tapTarget: null, mapId: "town", pendingRun: 0,
        returnPoint: null, returnObjective: "", doorCooldown: 0, shopOwned: [], smokeCharm: false,
        enemies: [], nodes: [], platform: null, residents: makeResidents()
      });
      game.hero = {
        x: 540, y: 888, r: 11, moveR: 7, hp: 100, maxHp: 100,
        speed: 114, damage: 1, gather: 1, fogRate: 1,
        attackCooldown: 0, attackFx: 0, facingX: 0, facingY: -1,
        invulnerable: 0, moving: false, killHeal: 0
      };
      bell.integrity = bell.maxIntegrity = 100;
      bell.resonance = 0;
      particles = [];
      cameraX = 382;
      cameraY = 488;
      setObjective("Talk to the town official");
      say("Official: Recover the clapper, gather cedar and ash, then strengthen the bell before dusk.", 5);
    }

    function makeResidents() {
      return [
        { x: 170, y: 790, axis: "x", low: 80, high: 390, dir: 1, speed: 30, column: 1, row: 0, role: "FISHERMAN", line: "Fisherman: The inn is west. The forge is east. The fish refuse to choose sides." },
        { x: 350, y: 805, axis: "y", low: 745, high: 945, dir: 1, speed: 24, column: 4, row: 0, role: "MERCHANT", line: "Merchant: Cedar fiber binds the ward repairs. Ash makes the binding hold." },
        { x: 850, y: 790, axis: "y", low: 740, high: 935, dir: -1, speed: 27, column: 2, row: 0, role: "TOWNSWOMAN", line: "Townswoman: The smith sharpens steel. Her conversation is less polished." }
      ];
    }

    function setObjective(value) {
      if (game.objective !== value) objectiveTime = 4.5;
      game.objective = value;
    }
    function say(value, seconds = 2.8) { message = value; messageTime = Math.min(seconds, 3.6); }
    function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
    function near(a, b, radius) { return Math.hypot(a.x - b.x, a.y - b.y) <= radius; }
    function inCircle(x, y, circle) { return Math.hypot(x - circle.x, y - circle.y) <= circle.r; }

    function buildTransparentCitizenAtlas(image, removeEnclosed = false) {
      const atlas = document.createElement("canvas");
      atlas.width = image.naturalWidth;
      atlas.height = image.naturalHeight;
      const atlasCtx = atlas.getContext("2d", { willReadFrequently: true });
      atlasCtx.drawImage(image, 0, 0);
      const pixels = atlasCtx.getImageData(0, 0, atlas.width, atlas.height);
      const data = pixels.data;
      const width = atlas.width;
      const height = atlas.height;
      const total = width * height;
      const visited = new Uint8Array(total);
      const queue = new Int32Array(total);
      let head = 0;
      let tail = 0;
      const isMatte = index => {
        const offset = index * 4;
        const r = data[offset], g = data[offset + 1], b = data[offset + 2];
        return Math.min(r, g, b) > 225 && Math.max(r, g, b) - Math.min(r, g, b) < 14;
      };
      if (removeEnclosed) {
        for (let index = 0; index < total; index++) if (isMatte(index)) data[index * 4 + 3] = 0;
        atlasCtx.putImageData(pixels, 0, 0);
        return atlas;
      }
      const enqueue = index => {
        if (index < 0 || index >= total || visited[index] || !isMatte(index)) return;
        visited[index] = 1;
        queue[tail++] = index;
      };
      for (let x = 0; x < width; x++) { enqueue(x); enqueue((height - 1) * width + x); }
      for (let y = 1; y < height - 1; y++) { enqueue(y * width); enqueue(y * width + width - 1); }
      while (head < tail) {
        const index = queue[head++];
        data[index * 4 + 3] = 0;
        const x = index % width;
        if (x > 0) enqueue(index - 1);
        if (x < width - 1) enqueue(index + 1);
        if (index >= width) enqueue(index - width);
        if (index < total - width) enqueue(index + width);
      }
      atlasCtx.putImageData(pixels, 0, 0);
      return atlas;
    }

    function startAudio() {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      if (!music) {
        music = new Audio();
        music.loop = true;
        music.preload = "auto";
        music.playsInline = true;
        music.volume = 0;
      }
      if (!musicTrack) setMusicTrack(desiredMusicTrack());
      else music.play().catch(() => {});
    }

    const MUSIC_TRACKS = {
      town: "assets/audio/town-sun-over-gate.mp3",
      field: "assets/audio/field-sunlight-blade.mp3",
      chase: "assets/audio/spirit-kinetic-chase.mp3",
      danger: "assets/audio/danger-kinetic-protocol.mp3",
      breach: "assets/audio/breach-shattered-ceiling.mp3"
    };

    function desiredMusicTrack() {
      if (game.scene === "outcome") return game.outcome === "victory" ? "town" : "";
      if (game.scene === "title") return "town";
      if (game.phase === "breach") return "breach";
      if (game.scene === "platform") return "chase";
      if (game.mapId === "outside") return musicDangerHold > 0 ? "danger" : "field";
      return "town";
    }

    function setMusicTrack(key) {
      if (!music || key === musicTrack) return;
      musicTrack = key;
      musicFade = 0;
      music.pause();
      if (!key || !MUSIC_TRACKS[key]) {
        music.removeAttribute("src");
        return;
      }
      music.src = MUSIC_TRACKS[key];
      music.currentTime = 0;
      music.volume = 0;
      music.play().catch(() => {});
    }

    function updateMusic(dt) {
      if (game.scene === "topdown" && game.mapId === "outside" && game.hero) {
        const threatNear = game.enemies.some(enemy => !enemy.dead && Math.hypot(enemy.x - game.hero.x, enemy.y - game.hero.y) < 175);
        musicDangerHold = threatNear ? 2.8 : Math.max(0, musicDangerHold - dt);
      } else musicDangerHold = 0;
      if (!music) return;
      const wanted = desiredMusicTrack();
      if (wanted !== musicTrack) setMusicTrack(wanted);
      musicFade = Math.min(1, musicFade + dt * 1.8);
      music.volume = musicMuted ? 0 : 0.44 * musicFade;
      canvas.dataset.musicTrack = musicTrack;
      canvas.dataset.musicMuted = String(musicMuted);
      canvas.dataset.musicReady = String(music.readyState);
    }

    function toggleMusic() {
      musicMuted = !musicMuted;
      if (music) music.volume = musicMuted ? 0 : 0.44 * musicFade;
      say(musicMuted ? "Music muted" : "Music restored", 1.2);
    }

    function sfx(type) {
      if (!audio) return;
      const tones = {
        slash: [220, 105, 0.07, "sawtooth"], hit: [100, 55, 0.08, "square"],
        pickup: [520, 820, 0.11, "triangle"], hurt: [140, 65, 0.14, "square"],
        upgrade: [330, 900, 0.36, "triangle"], jump: [240, 430, 0.1, "square"],
        bell: [392, 196, 0.55, "sine"], lose: [170, 55, 0.6, "sawtooth"],
        win: [440, 980, 0.7, "triangle"]
      };
      const tone = tones[type] || tones.pickup;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      const now = audio.currentTime;
      osc.type = tone[3];
      osc.frequency.setValueAtTime(tone[0], now);
      osc.frequency.exponentialRampToValueAtTime(tone[1], now + tone[2]);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + tone[2]);
      osc.connect(gain).connect(audio.destination);
      osc.start(now);
      osc.stop(now + tone[2]);
    }

    function pointerPos(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * W / rect.width,
        y: (event.clientY - rect.top) * H / rect.height
      };
    }

    canvas.addEventListener("pointerdown", event => {
      event.preventDefault();
      startAudio();
      canvas.setPointerCapture(event.pointerId);
      const p = pointerPos(event);
      if (game.scene === "title" || game.scene === "outcome") { resetGame(); return; }
      if (inCircle(p.x, p.y, musicButton)) { toggleMusic(); return; }
      if (game.scene === "repair") { chooseRepairAt(p.x, p.y); return; }
      if (game.scene === "shop") { chooseShopAt(p.x, p.y); return; }
      if (p.x < 160 && p.y > 480) {
        stick.active = true;
        stick.id = event.pointerId;
        updateStick(p.x, p.y);
      } else if (game.scene === "platform" && inCircle(p.x, p.y, contextButton)) {
        contextButton.down = true;
        contextButton.id = event.pointerId;
        doAttack();
      } else if (inCircle(p.x, p.y, actionButton)) {
        actionButton.down = true;
        actionButton.id = event.pointerId;
        if (game.scene === "platform") doJump();
        else doAttack();
      } else if (game.scene === "topdown" && contextAction() && inCircle(p.x, p.y, contextButton)) {
        contextButton.down = true;
        contextButton.id = event.pointerId;
        doInteract();
      } else if (game.scene === "topdown") {
        const zoom = (game.mapId === "inn" || game.mapId === "smith") ? 1 : CAMERA_ZOOM;
        game.tapTarget = { x: p.x / zoom + cameraX, y: p.y / zoom + cameraY };
      }
    });

    canvas.addEventListener("pointermove", event => {
      if (!stick.active || stick.id !== event.pointerId) return;
      const p = pointerPos(event);
      updateStick(p.x, p.y);
    });

    function releasePointer(event) {
      if (stick.id === event.pointerId) {
        stick.active = false; stick.id = null; stick.dx = 0; stick.dy = 0;
      }
      if (actionButton.id === event.pointerId) {
        actionButton.down = false; actionButton.id = null;
      }
      if (contextButton.id === event.pointerId) {
        contextButton.down = false; contextButton.id = null;
      }
    }
    canvas.addEventListener("pointerup", releasePointer);
    canvas.addEventListener("pointercancel", releasePointer);

    function updateStick(x, y) {
      const dx = x - stick.x;
      const dy = y - stick.y;
      const magnitude = Math.hypot(dx, dy) || 1;
      const scale = Math.min(stick.r, magnitude) / magnitude;
      stick.dx = dx * scale / stick.r;
      stick.dy = dy * scale / stick.r;
    }

    addEventListener("keydown", event => {
      keys.add(event.key.toLowerCase());
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(event.key.toLowerCase())) event.preventDefault();
      if (event.key === " " && !event.repeat) {
        startAudio();
        if (game.scene === "title" || game.scene === "outcome") resetGame();
        else if (game.scene === "platform") doJump();
        else doAttack();
      }
      if (event.key.toLowerCase() === "j" && !event.repeat) doAttack();
      if (event.key.toLowerCase() === "m" && !event.repeat) { startAudio(); toggleMusic(); }
      if (event.key.toLowerCase() === "e" && !event.repeat) {
        if (game.scene === "shop") closeShop();
        else doInteract();
      }
      if (game.scene === "repair" && ["1", "2"].includes(event.key)) chooseRepair(Number(event.key) - 1);
      if (game.scene === "shop" && ["1", "2"].includes(event.key)) chooseShop(Number(event.key) - 1);
      if (game.scene === "shop" && event.key.toLowerCase() === "escape") closeShop();
    });
    addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));

    function movementInput() {
      let x = stick.dx;
      let y = stick.dy;
      if (stick.active) {
        // A thumb rarely lands on the joystick's exact vertical/horizontal axis.
        // Snap near-cardinal gestures so a deliberate UP/DOWN input cannot
        // accumulate sideways drift, while still preserving true diagonals.
        if (Math.abs(y) > 0.22 && Math.abs(x) < Math.abs(y) * 0.48) x = 0;
        else if (Math.abs(x) > 0.22 && Math.abs(y) < Math.abs(x) * 0.48) y = 0;
        if (Math.hypot(x, y) < 0.12) { x = 0; y = 0; }
      }
      if (keys.has("a") || keys.has("arrowleft")) x -= 1;
      if (keys.has("d") || keys.has("arrowright")) x += 1;
      if (keys.has("w") || keys.has("arrowup")) y -= 1;
      if (keys.has("s") || keys.has("arrowdown")) y += 1;
      const magnitude = Math.hypot(x, y);
      return magnitude > 1 ? { x: x / magnitude, y: y / magnitude } : { x, y };
    }

    function doAttack() {
      if (game.scene === "platform") { platformSlash(); return; }
      if (game.scene !== "topdown") return;
      if (game.hasKatana) slash();
      else say("Talk to the official. He has your katana and several opinions.");
    }

    function doJump() {
      if (game.scene !== "platform") return;
      platformJump();
    }

    function contextAction() {
      if (game.scene !== "topdown") return null;
      const hero = game.hero;
      if (game.mapId === "inn") {
        if (near(hero, innkeeper, 68)) return { label: "REST", type: "rest" };
        return game.doorCooldown <= 0 && near(hero, { x: 180, y: 570 }, 64) ? { label: "EXIT", type: "leaveInn" } : null;
      }
      if (game.mapId === "smith") {
        if (near(hero, smithkeeper, 92)) return { label: "TRADE", type: "shop" };
        return game.doorCooldown <= 0 && near(hero, { x: 180, y: 570 }, 64) ? { label: "EXIT", type: "leaveSmith" } : null;
      }
      if (game.mapId === "town") {
        if (game.phase === "town_intro" && near(hero, official, 64)) return { label: "TALK", type: "official" };
        if (game.phase !== "town_intro" && game.phase !== "breach" && near(hero, official, 54)) return { label: "TALK", type: "officialAgain" };
        if (["chase_gate", "town_gate", "town_gate2"].includes(game.phase) && near(hero, townGate, 76)) return { label: "ENTER", type: "enterGate" };
        if (game.doorCooldown <= 0 && game.phase !== "breach" && near(hero, innDoor, 62)) return { label: "ENTER", type: "enterInn" };
        if (game.doorCooldown <= 0 && game.phase !== "breach" && near(hero, smithDoor, 62)) return { label: "ENTER", type: "enterSmith" };
        if (game.phase === "breach" && near(hero, bell, 70)) return { label: "RING", type: "ring" };
        const resident = game.residents.find(person => near(hero, person, 48));
        if (resident) return { label: "TALK", type: "resident", resident };
      }
      if (game.mapId === "outside") {
        if (game.phase === "chase_field" && near(hero, spiritTrail, 76)) return { label: "CHASE", type: "spiritTrail" };
        if ((game.phase === "run1" || game.phase === "run2") && near(hero, spiritTrail, 76)) return { label: "PATH", type: "revisitPath" };
        if (near(hero, sealedGate, 70)) return { label: "SEALED", type: "sealedGate" };
        if (game.phase === "post_chase_field" && near(hero, outsideGate, 78)) return { label: "TOWN", type: "returnAfterChase" };
        if ((game.phase === "run1" || game.phase === "run2") && near(hero, outsideGate, 78)) return { label: "RETURN", type: "returnGate" };
        const node = game.nodes.find(item => item.active && near(hero, item, 58));
        if (node) return { label: "GATHER", type: "gather", node };
      }
      return null;
    }

    function doInteract() {
      const action = contextAction();
      if (!action) { say("Nothing to use here.", 1.4); return; }
      if (action.type === "official") {
        game.hasKatana = true;
        game.phase = "town_escape";
        const runner = spawnEnemy("bandit", 650, 800);
        runner.state = "escapeTown";
        runner.route = [[590, 800], [540, 720], [540, 620]];
        runner.routeIndex = 0;
        setObjective("The clapper thief is escaping through North Gate");
        say("Official: That runner has the clapper—and he is heading for North Gate. After him!", 5);
        sfx("upgrade");
      } else if (action.type === "officialAgain") {
        say(game.phase === "town_escape" || game.phase === "chase_gate"
          ? "Official: North Gate. The rapidly disappearing criminal should narrow it down."
          : "Official: North Gate. Fog. Cedar. Ash. I have now exhausted my useful vocabulary.", 4);
      } else if (action.type === "spiritTrail") startPlatform();
      else if (action.type === "revisitPath") startPlatform(true);
      else if (action.type === "enterGate") {
        if (game.phase === "chase_gate") beginChaseField();
        else beginRun(game.phase === "town_gate2" ? 2 : 1);
      }
      else if (action.type === "enterInn") enterInn();
      else if (action.type === "leaveInn") leaveInn();
      else if (action.type === "enterSmith") enterSmith();
      else if (action.type === "leaveSmith") leaveSmith();
      else if (action.type === "rest") restAtInn();
      else if (action.type === "shop") openShop();
      else if (action.type === "resident") say(action.resident.line, 3.4);
      else if (action.type === "sealedGate") say(game.chaseComplete
        ? "The northern ward gate is sealed in this prototype. The forest remains hostile behind you."
        : "A ward lock bars the northern gate. The thief cut toward the torii trail instead.", 4);
      else if (action.type === "gather") gatherNode(action.node);
      else if (action.type === "returnAfterChase") returnToTownAfterChase();
      else if (action.type === "returnGate") {
        if (canReturn()) openRepair();
        else {
          const need = runRequirement(game.run);
          say(`Still need ${Math.max(0, need.cedar - game.cedar)} cedar and ${Math.max(0, need.ash - game.ash)} ash.`);
        }
      } else if (action.type === "ring") ringBell();
    }

      return [

        { name: "Fox-Smoke Charm", detail: "Fog fronts build 22% slower next expedition", mon: 2, id: "smoke", oneTime: false }

    function chooseShopAt(x, y) {
      if (x > 22 && x < 338 && y > 184 && y < 352) chooseShop(0);
      else if (x > 22 && x < 338 && y > 364 && y < 534) chooseShop(1);
      else if (x > 34 && x < 326 && y > 548 && y < 626) closeShop();

    function chooseShop(index) {
      const option = shopOptions()[index];
      if (!option) return;
      if (option.id === "smoke" && game.smokeCharm) {
        say("Fox-smoke is already prepared for the next expedition.");
        return;
      }
      if (option.oneTime && game.shopOwned.includes(option.id)) {
        say("Already purchased for this session.");
        return;
      }
      if (game.mon < option.mon) {
        say(`Need ${option.mon - game.mon} more mon. Yokai and path guards carry it.`);
        sfx("hurt");
        return;
      }
      game.mon -= option.mon;
      if (option.oneTime) game.shopOwned.push(option.id);
      if (option.id === "whetstone") game.hero.damage += 1;
      if (option.id === "smoke") game.smokeCharm = true;
      game.score += 80;
      sfx("upgrade");
      say(`${option.name} purchased.`);

    function nearestEnemy(radius) {
      const hero = game.hero;
      return game.enemies
        .filter(enemy => !enemy.dead && near(hero, enemy, radius))
        .sort((a, b) => Math.hypot(hero.x - a.x, hero.y - a.y) - Math.hypot(hero.x - b.x, hero.y - b.y))[0];
    }

    function slash() {
      const hero = game.hero;
      if (hero.attackCooldown > 0) return;
      const target = nearestEnemy(62);
      if (target) {
        const distance = Math.hypot(target.x - hero.x, target.y - hero.y) || 1;
        hero.facingX = (target.x - hero.x) / distance;
        hero.facingY = (target.y - hero.y) / distance;
      }
      hero.attackCooldown = 0.34;
      hero.attackFx = 0.24;
      sfx("slash");
      let struck = false;
      for (const enemy of game.enemies) {
        if (enemy.dead) continue;
        if (enemy.type === "bandit" && (game.phase === "town_escape" || game.phase === "chase_field")) continue;
        const dx = enemy.x - hero.x;
        const dy = enemy.y - hero.y;
        const distance = Math.hypot(dx, dy);
        const facing = (dx * hero.facingX + dy * hero.facingY) / (distance || 1);
        if (distance < 56 && facing > -0.15) {
          enemy.hp -= hero.damage;
          enemy.x += hero.facingX * 18;
          enemy.y += hero.facingY * 18;
          enemy.flash = 0.13;
          struck = true;
          screenShake = 4;
          burst(enemy.x, enemy.y, "#fff2d0", 9);
          if (enemy.hp <= 0) killEnemy(enemy);
        }
      }
      if (struck) sfx("hit");
    }

    function gatherNode(node) {
      node.active = false;
      game.cedar += game.hero.gather;
      game.score += 25 * game.hero.gather;
      burst(node.x, node.y, "#d7c267", 13);
      say(`Cedar fiber +${game.hero.gather} — combine it with spirit ash to build a bell repair.`);
      sfx("pickup");

    function enemyStats(type) {
      return {
        bandit: [2, 54, 0, 12],
        wisp: [2 + game.run, 34 + game.run * 4, 5, 11],
        prowler: [3 + game.run, 52, 7, 13],
        raider: [4, 42, 8, 13],
        boss: [16, 30, 12, 25]
      }[type];
    }

    function spawnEnemy(type, x = 45 + Math.random() * 270, y = 180) {
      const stats = enemyStats(type);
      const enemy = {
        x, y, type, hp: stats[0], maxHp: stats[0], speed: stats[1],
        damage: stats[2], r: stats[3], moveR: Math.max(7, stats[3] * 0.65), hitClock: 0, flash: 0,
        dead: false, boss: type === "boss", seed: Math.random() * 20,
        state: type === "bandit" ? "patrol" : "wander", stateClock: 0.6 + Math.random(),
        animDistance: 0, facingX: 0
      };
      game.enemies.push(enemy);
      return enemy;
    }

    function killEnemy(enemy) {
      if (enemy.dead) return;
      enemy.dead = true;
      if (enemy.type === "bandit") {
        game.banditFled = true;
        game.mon += 1;
        game.phase = "town_gate";
        setObjective("Take the recovered clapper through North Gate");
        say("Thief: Keep the clapper! I am changing careers to something safer, like fireworks.", 4);
        burst(enemy.x, enemy.y, "#d39a58", 16);
        sfx("upgrade");
        return;
      }
      const reward = enemy.boss ? 4 : 1;
      const monReward = enemy.boss ? 3 : 1;
      game.ash += reward;
      game.mon += monReward;
      if (game.hero.killHeal > 0) game.hero.hp = Math.min(game.hero.maxHp, game.hero.hp + game.hero.killHeal);
      game.score += enemy.boss ? 1200 : 90;
      burst(enemy.x, enemy.y, enemy.boss ? "#f1c451" : "#7ed9cc", enemy.boss ? 40 : 18);
      if (enemy.boss) {
        game.bossDefeated = true;
        setObjective("Ring the ward bell to full resonance");
        say("The gate yokai is broken. Finish the ward with the bell!", 4);
        if (bell.resonance >= 100) finish("victory");
      } else say(`Spirit ash +${reward} • Mon +${monReward}`);
    }

    function platformJump() {

      if (!p) return;
      if (p.grounded) {

        if (Math.abs(p.vx) < 70) p.vx = (p.facing || 1) * 92;
        p.grounded = false;
        sfx("jump");

    function platformSlash() {
      const p = game.platform;
      if (!p || p.slash > 0) return;
      p.slash = 0.28;

    function makeNodes(number) {
      const positions = number === 1
        ? [[360, 850], [350, 750], [400, 610], [365, 540], [330, 450], [520, 300]]
        : [[385, 850], [350, 730], [430, 600], [450, 560], [330, 475], [560, 380], [550, 280], [580, 170]];
      return positions.map(([x, y]) => ({ x, y, active: true, pulse: Math.random() * 6.28 }));

    function runRequirement(number) {
      return number === 1 ? { cedar: 3, ash: 2 } : { cedar: 4, ash: 3 };

      const need = runRequirement(game.run);
      return game.cedar >= need.cedar && game.ash >= need.ash;

      game.enemies = [];

      game.upgradeOptions = game.run === 1 ? [
        { name: "Braided Ward Rope", detail: "Fog fronts build 25% slower", cedar: 3, ash: 2, id: "rope" },
        { name: "Tempered Clapper", detail: "+1 katana damage; stronger bell rings", cedar: 3, ash: 2, id: "clapper" }
      ] : [
        { name: "Gate Talismans", detail: "+40 bell integrity in the final breach", cedar: 4, ash: 3, id: "talismans" },
        { name: "Warrior's Knot", detail: "+30 health; defeating yokai restores 5", cedar: 4, ash: 3, id: "knot" }
      ];
      setObjective("Convert your materials into one visible repair");
      say("Back at the bell yard. Pick one repair; the other path stays closed.", 4);

      else if (x > 22 && x < 338 && y > 364 && y < 534) chooseRepair(1);
    }

    function chooseRepair(index) {
      if (game.scene !== "repair") return;
      const option = game.upgradeOptions[index];
      if (!option || game.cedar < option.cedar || game.ash < option.ash) {
        say("That repair still needs more material.");
        sfx("hurt");
        return;
      }
      game.cedar -= option.cedar;
      game.ash -= option.ash;
      game.upgrades.push(option.name);
      if (option.id === "rope") game.hero.fogRate = 0.75;
      if (option.id === "clapper") game.hero.damage += 1;
      if (option.id === "talismans") bell.maxIntegrity += 40;
      if (option.id === "knot") {
        game.hero.maxHp += 30;
        game.hero.hp = game.hero.maxHp;
        game.hero.killHeal = 5;
      }
      game.score += 350;
      sfx("upgrade");
      if (game.run === 1) {
        prepareTownDeparture(2);
        say(`${option.name} installed on the ward bell. Its effect is active for the second expedition.`, 4.6);
      } else {
        startBreach();
        say(`${option.name} installed. FINAL BREACH — defend the upgraded bell and charge its ward.`, 5);
      }

    function prepareTownDeparture(number) {
      Object.assign(game, {
        scene: "topdown", mapId: "town", phase: number === 1 ? "town_gate" : "town_gate2",

      });
      game.hero.x = townGate.x;
      game.hero.y = townGate.y + 115;
      cameraX = 382;
      cameraY = TOWN_Y;
      setObjective(number === 1 ? "Enter North Gate for the first supply run" : "Re-enter North Gate for the harder second run");

        ? "Clapper recovered. The north gate is open; press ENTER at the gate when ready."
        : "Repair installed. Walk back through North Gate when ready for the second run.", 5);

        scene: "topdown", mapId: "town", phase: "breach", run: 3, enemies: [], nodes: [],
        breachTime: 0, spawnClock: 0.7, bossSpawned: false,
        bossDefeated: false, ringCooldown: 0
      });
      bell.integrity = bell.maxIntegrity;
      bell.resonance = 0;
      game.hero.x = 540;
      game.hero.y = 835;
      cameraX = 382;
      cameraY = 488;
      setObjective("Defend the bell • Ring it when the yard is clear");
      say("FINAL BREACH — yokai can now cross the gate. Protect the bell and build resonance.", 5);
    }

    function ringBell() {
      if (game.ringCooldown > 0) return;
      const closeThreat = game.enemies.some(enemy => !enemy.dead && near(enemy, bell, 90));
      if (closeThreat) { say("Clear the yokai away from the bell first."); return; }
      game.ringCooldown = 0.85;
      const strength = game.upgrades.includes("Tempered Clapper") ? 22 : 15;
      bell.resonance = Math.min(100, bell.resonance + strength);
      game.score += 75;
      burst(bell.x, bell.y - 30, "#f6d56c", 24);
      screenShake = 4;
      sfx("bell");
      if (bell.resonance >= 100) {
        if (game.bossDefeated) finish("victory");
        else {
          setObjective("The ward is charged • Defeat the gate yokai");
          say("The bell is fully charged. Now break the gate yokai!", 3.5);
        }
      }
    }

    function finish(result, cause = "") {
      if (game.scene === "outcome") return;
      game.outcome = result;
      game.defeatCause = result === "defeat" ? cause : "";
      game.scene = "outcome";
      if (result === "victory") {
        game.score += Math.round(game.hero.hp * 4 + bell.integrity * 3 + bell.resonance * 5);
        sfx("win");
      } else sfx("lose");
    }

    function burst(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 22 + Math.random() * 75;
        particles.push({
          x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          life: 0.35 + Math.random() * 0.45, color, world: game.scene === "topdown"
        });
      }
    }

    function update(dt) {
      messageTime = Math.max(0, messageTime - dt);
      objectiveTime = Math.max(0, objectiveTime - dt);
      screenShake = Math.max(0, screenShake - dt * 20);
      updateParticles(dt);
      if (game.scene === "topdown") updateTopdown(dt);
      else if (game.scene === "platform") updatePlatform(dt);
      updateMusic(dt);
    }

    function updateParticles(dt) {
      for (const particle of particles) {
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.vy += 70 * dt;
        particle.life -= dt;
      }
      particles = particles.filter(particle => particle.life > 0);
    }

    function mapBounds() {
      if (game.mapId === "town") return { left: 18, right: TOWN_W - 18, top: 500, bottom: 1142 };
      if (game.mapId === "inn" || game.mapId === "smith") return { left: 28, right: 332, top: 175, bottom: 578 };
      if (game.mapId === "outside") return { left: 18, right: FIELD_W - 18, top: 18, bottom: FIELD_H - 18 };
      return { left: 32, right: 328, top: 72, bottom: 700 };
    }

    function mapColliders() {
      if (game.mapId === "town") return [
        // Outside the final breach, the complete fenced bell garden is scenery.
        // During the breach the yard opens, while the bell structure itself stays solid.
        game.phase === "breach"
          ? { x: bell.x - 38, y: bell.y - 80, w: 76, h: 100 }
          : { x: bell.x - 67, y: bell.y - 91, w: 134, h: 161 },
        // The painted south gate includes a deep tiled roof. It is scenery, not a
        // continuation of the street, so keep a hard stop in front of its eaves.
        { x: 438, y: 1006, w: 204, h: 194 },
        ...(game.phase === "breach" ? [] : [{ x: official.x - 10, y: official.y + 1, w: 20, h: 12 }])
      ];
      return [];
    }

    function insideRect(x, y, r, rect) {
      return x >= rect.x + r && x <= rect.x + rect.w - r && y >= rect.y + r && y <= rect.y + rect.h - r;
    }

    function townWalkableAt(x, y, r) {
      const roads = [
        { x: 45, y: 700, w: 990, h: 315 },
        { x: 455, y: 540, w: 155, h: 190 },
        { x: 900, y: 590, w: 120, h: 140 }
      ];
      return roads.some(rect => insideRect(x, y, r, rect));
    }

    function interiorWalkableAt(x, y, r) {
      return insideRect(x, y, r, { x: 82, y: 312, w: 196, h: 240 }) ||
        insideRect(x, y, r, { x: 145, y: 520, w: 70, h: 66 });
    }

    function fieldWalkableAt(x, y, r) {
      const openAreas = [
        { x: 55, y: 135, w: 610, h: 770 },
        { x: 315, y: 70, w: 90, h: 120 },
        { x: 565, y: 70, w: 105, h: 155 }
      ];
      return openAreas.some(rect => insideRect(x, y, r, rect));
    }

    function circleHitsRect(x, y, r, rect) {
      const nx = clamp(x, rect.x, rect.x + rect.w);
      const ny = clamp(y, rect.y, rect.y + rect.h);
      return (x - nx) ** 2 + (y - ny) ** 2 < r ** 2;
    }

    function blockedAt(entity, x, y) {
      if (game.mapId === "outside" && !fieldWalkableAt(x, y, entity.moveR || entity.r)) return true;
      if (game.mapId === "town" && !townWalkableAt(x, y, entity.moveR || entity.r)) return true;
      if ((game.mapId === "inn" || game.mapId === "smith") && !interiorWalkableAt(x, y, entity.moveR || entity.r)) return true;
      if (mapColliders().some(rect => circleHitsRect(x, y, entity.moveR || entity.r, rect))) return true;
      if (entity === game.hero && game.mapId === "town") {
        // The north-gate art is a threshold, not walkable pavement. Keep Yusuke on
        // the town side until ENTER is pressed, matching the field-side return stop.
        if (game.phase !== "breach" && circleHitsRect(x, y, entity.moveR || entity.r, { x: 455, y: 570, w: 155, h: 68 })) return true;
        const actors = game.phase === "breach" ? [] : [official, ...game.residents];
        for (const actor of actors) {
          if (Math.hypot(x - actor.x, y - actor.y) < (entity.moveR || entity.r) + 22) return true;
        }
        for (const enemy of game.enemies) {
          if (!enemy.dead && Math.hypot(x - enemy.x, y - enemy.y) < (entity.moveR || entity.r) + enemy.moveR) return true;
        }
      }
      if (entity === game.hero && (game.mapId === "inn" || game.mapId === "smith")) {
        const keeper = game.mapId === "inn" ? innkeeper : smithkeeper;
        if (Math.hypot(x - keeper.x, y - keeper.y) < (entity.moveR || entity.r) + 11) return true;
      }
      return false;
    }

    function moveActor(entity, dx, dy) {
      const bounds = mapBounds();
      const nextX = clamp(entity.x + dx, bounds.left, bounds.right);
      if (!blockedAt(entity, nextX, entity.y)) entity.x = nextX;
      const nextY = clamp(entity.y + dy, bounds.top, bounds.bottom);
      if (!blockedAt(entity, entity.x, nextY)) entity.y = nextY;
    }

    function moveEnemyAnimated(enemy, dx, dy) {
      const beforeX = enemy.x;
      const beforeY = enemy.y;
      moveActor(enemy, dx, dy);
      const movedX = enemy.x - beforeX;
      const movedY = enemy.y - beforeY;
      const distance = Math.hypot(movedX, movedY);
      if (distance > 0.01) {
        enemy.animDistance = (enemy.animDistance || 0) + distance;
        if (Math.abs(movedX) > 0.02) enemy.facingX = Math.sign(movedX);
      }
    }

    function updateTopdown(dt) {
      const hero = game.hero;
      game.elapsed += dt;
      hero.attackCooldown = Math.max(0, hero.attackCooldown - dt);
      hero.attackFx = Math.max(0, hero.attackFx - dt);
      hero.invulnerable = Math.max(0, hero.invulnerable - dt);
      game.ringCooldown = Math.max(0, game.ringCooldown - dt);
      game.doorCooldown = Math.max(0, game.doorCooldown - dt);

      let input = movementInput();
      if (Math.hypot(input.x, input.y) > 0.1) game.tapTarget = null;
      if (game.tapTarget && Math.hypot(input.x, input.y) <= 0.1) {
        const tx = game.tapTarget.x - hero.x;
        const ty = game.tapTarget.y - hero.y;
        const distance = Math.hypot(tx, ty);
        if (distance < 7) game.tapTarget = null;
        else input = { x: tx / distance, y: ty / distance };
      }

      if (Math.hypot(input.x, input.y) > 0.1) {
        hero.moving = true;
        hero.facingX = input.x;
        hero.facingY = input.y;
        const beforeX = hero.x;
        const beforeY = hero.y;
        moveActor(hero, input.x * hero.speed * dt, input.y * hero.speed * dt);
        if (game.tapTarget && Math.hypot(hero.x - beforeX, hero.y - beforeY) < 0.02) {
          game.tapTarget = null;
          hero.moving = false;
        }
      } else hero.moving = false;

      const zoom = (game.mapId === "inn" || game.mapId === "smith") ? 1 : CAMERA_ZOOM;
      const mapWidth = game.mapId === "town" ? TOWN_W : game.mapId === "outside" ? FIELD_W : W;
      const mapHeight = game.mapId === "outside" ? FIELD_H : WORLD_H;
      const visibleWidth = W / zoom;
      const visibleHeight = H / zoom;
      cameraX += (clamp(hero.x - visibleWidth / 2, 0, Math.max(0, mapWidth - visibleWidth)) - cameraX) * Math.min(1, dt * 7);
      const targetCameraY = (game.mapId === "inn" || game.mapId === "smith")
        ? 0
        : clamp(hero.y - 360, game.mapId === "town" ? TOWN_Y : 0, mapHeight - visibleHeight);
      cameraY += (targetCameraY - cameraY) * Math.min(1, dt * 7);
      if (game.phase === "run1" || game.phase === "run2") updateRun(dt);
      if (game.phase === "breach") updateBreach(dt);
      if (game.mapId === "town" && game.phase !== "breach") updateResidents(dt);
      for (const enemy of game.enemies) updateEnemy(enemy, dt);
      game.enemies = game.enemies.filter(enemy => !enemy.dead || enemy.flash > -0.24);
      if (hero.hp <= 0) {
        const cause = (game.phase === "run1" || game.phase === "run2") && game.fogPhase === "surge" && game.fog >= 100
          ? "fog"
          : game.phase === "breach" ? "defender" : "yokai";
        finish("defeat", cause);
      } else if (game.phase === "breach" && bell.integrity <= 0) finish("defeat", "bell");
    }

    function updateResidents(dt) {
      for (const person of game.residents) {
        person.pause = Math.max(0, (person.pause || 0) - dt);
        person.moving = false;
        if (person.pause > 0) continue;
        const amount = person.speed * person.dir * dt;
        const nextX = person.axis === "x" ? person.x + amount : person.x;
        const nextY = person.axis === "y" ? person.y + amount : person.y;
        if (Math.hypot(game.hero.x - nextX, game.hero.y - nextY) < 36) {
          person.pause = 0.22;
          continue;
        }
        person.x = nextX;
        person.y = nextY;
        person.moving = true;
        person.walkClock = (person.walkClock || 0) + Math.abs(amount) / 18;
        const value = person.axis === "x" ? person.x : person.y;
        if (value <= person.low || value >= person.high) {
          if (person.axis === "x") person.x = clamp(person.x, person.low, person.high);
          else person.y = clamp(person.y, person.low, person.high);
          person.dir *= -1;
        }
      }
    }

    function updateRun(dt) {
      const hero = game.hero;
      if (game.mapId === "outside") {
        game.outsideVisited = true;
        game.fogPhaseClock -= dt;
        if (game.fogPhase === "clear") {
          game.fog = Math.max(0, game.fog - 4 * dt);
          if (game.fogPhaseClock <= 0) {
            game.fogPhase = "warning";
            game.fogPhaseClock = game.run === 1 ? 4.5 : 3.5;
            say("THE WIND HAS STOPPED — a fog front is approaching. Finish nearby work or turn south.", 4.2);
            sfx("hurt");
          }
        } else if (game.fogPhase === "warning") {
          game.fog = Math.max(0, game.fog - dt);
          if (game.fogPhaseClock <= 0) {
            game.fogPhase = "surge";
            game.fogPhaseClock = 9;
            game.fogFront += 1;
            game.fogPainClock = 1.2;
            say("FOG FRONT — visibility is collapsing. Follow the lantern road south if the pressure fills.", 4.5);
            screenShake = 3;
            sfx("hurt");
          }
        } else {
          const baseRate = game.run === 1 ? 11 : 13;
          const frontForce = 1 + Math.min(0.3, Math.max(0, game.fogFront - 1) * 0.1);
          game.fog = Math.min(100, game.fog + baseRate * frontForce * hero.fogRate * game.runFogMod * dt);
          if (game.fog >= 85 && game.fogWarning < game.fogFront) {
            game.fogWarning = game.fogFront;
            say("WHITEOUT NEAR — abandon the haul and take the south road if you cannot finish now!", 4);
            screenShake = 4;
            sfx("hurt");
          }
          if (game.fogPhaseClock <= 0) {
            game.fogPhase = "clear";
            game.fogPhaseClock = game.run === 1 ? 18 : 12;
            game.fog = Math.max(0, game.fog - 45);
            say("The fog front has passed. The field is visible again—for now.", 3.8);
            sfx("pickup");
          }
        }
        game.spawnClock -= dt;
        const active = game.enemies.filter(enemy => !enemy.dead).length;
        const limit = game.run === 1 ? 2 : 3;
        if (game.spawnClock <= 0 && active < limit) {
          const type = game.run === 2 && Math.random() > 0.48 ? "prowler" : "wisp";
          let x = clamp(hero.x + (Math.random() > 0.5 ? 120 : -120), 48, FIELD_W - 48);
          let y = clamp(hero.y + (Math.random() > 0.5 ? 125 : -125), 145, FIELD_H - 65);
          if (!fieldWalkableAt(x, y, 12)) {
            x = clamp(hero.x + (Math.random() - 0.5) * 90, 120, FIELD_W - 120);
            y = clamp(hero.y - 85, 150, FIELD_H - 80);
          }
          spawnEnemy(type, x, y);
          game.spawnClock = game.run === 1 ? 7 : 4.7;
        }
        if (game.fogPhase === "surge" && game.fog >= 100) {
          game.fogPainClock -= dt;
          if (game.fogPainClock <= 0) {
            game.fogPainClock = 0.9;
            hero.hp -= 7;
            screenShake = 5;
            sfx("hurt");
            say("LOST AIR — this fog front is draining health. Follow the lantern road south!", 3.6);
          }
        }
      }

      const need = runRequirement(game.run);
      if (near(hero, outsideGate, 86)) {
        const cedarLeft = Math.max(0, need.cedar - game.cedar);
        const ashLeft = Math.max(0, need.ash - game.ash);
        setObjective(canReturn() ? "Press RETURN at North Gate" : `Still need ${cedarLeft} cedar + ${ashLeft} ash`);
      } else if (game.fogPhase === "clear") {
        setObjective(`${need.cedar} cedar + ${need.ash} ash • clear field ${Math.ceil(game.fogPhaseClock)}s`);
      } else if (game.fogPhase === "warning") {
        setObjective(`Fog front in ${Math.ceil(game.fogPhaseClock)}s • finish nearby work or turn south`);
      } else {
        setObjective(`${need.cedar} cedar + ${need.ash} ash • FOG FRONT ${Math.ceil(game.fogPhaseClock)}s`);
      }
    }

    function updateBreach(dt) {
      game.breachTime += dt;
      game.spawnClock -= dt;
      const active = game.enemies.filter(enemy => !enemy.dead && !enemy.boss).length;
      if (game.spawnClock <= 0 && active < 3 && game.breachTime < 44) {
        spawnEnemy(Math.random() > 0.5 ? "raider" : "wisp", 500 + Math.random() * 75, 685 + Math.random() * 28);
        game.spawnClock = game.bossSpawned ? 5.4 : 4.2;
      }
      if (!game.bossSpawned && game.breachTime > 9) {
        game.bossSpawned = true;
        spawnEnemy("boss", townGate.x, 690);
        say("The gate yokai has arrived. Charge the bell and bring it down!", 4);
        screenShake = 8;
      }
    }

    function updateEnemy(enemy, dt) {
      enemy.flash -= dt;
      if (enemy.dead) return;
      enemy.hitClock -= dt;
      enemy.stateClock -= dt;
      const hero = game.hero;

      if (enemy.type === "bandit") {
        if (enemy.state === "escapeTown" || enemy.state === "escapeField") {
          const point = enemy.route?.[enemy.routeIndex || 0];
          if (!point) {
            enemy.dead = true;
            if (enemy.state === "escapeTown") {
              game.phase = "chase_gate";
              setObjective("The thief escaped • enter North Gate and continue the chase");
              say("The thief vanished beyond North Gate. Follow him into the field.", 3.5);
            } else {
              setObjective("The thief entered the torii trail • press CHASE at the entrance");
              say("The thief slipped onto the Forest Spirit Path. His guards are waiting inside.", 3.5);
            }
            return;
          }
          const dx = point[0] - enemy.x;
          const dy = point[1] - enemy.y;
          const distance = Math.hypot(dx, dy) || 1;
          moveEnemyAnimated(enemy, dx / distance * (enemy.state === "escapeTown" ? 86 : 72) * dt, dy / distance * (enemy.state === "escapeTown" ? 86 : 72) * dt);
          if (distance < 10) enemy.routeIndex += 1;
          return;
        }
        if (near(enemy, hero, 86)) {
          const dx = enemy.x - hero.x;
          const dy = enemy.y - hero.y;
          const distance = Math.hypot(dx, dy) || 1;
          moveEnemyAnimated(enemy, dx / distance * 36 * dt, dy / distance * 36 * dt);
        } else {
          const patrolDirection = Math.sin(game.elapsed * 1.8 + enemy.seed) > 0 ? 1 : -1;
          moveEnemyAnimated(enemy, patrolDirection * 34 * dt, Math.sin(game.elapsed * 2.3 + enemy.seed) * 13 * dt);
        }
        return;
      }

      const targetsBell = game.phase === "breach" && (enemy.type === "raider" || enemy.type === "boss");
      const target = targetsBell ? bell : hero;
      const dx = target.x - enemy.x;
      const dy = target.y - enemy.y;
      const distance = Math.hypot(dx, dy) || 1;

      if (enemy.state === "recover") {
        if (enemy.stateClock <= 0) enemy.state = "chase";
        return;
      }
      if (enemy.state === "telegraph") {
        if (enemy.stateClock <= 0) {
          if (!targetsBell && distance < enemy.r + hero.r + 18 && hero.invulnerable <= 0) {
            hero.hp -= enemy.damage;
            hero.invulnerable = 0.9;
            moveActor(hero, -dx / distance * 22, -dy / distance * 22);
            screenShake = 6; sfx("hurt");
          } else if (targetsBell && distance < 52) {
            bell.integrity -= enemy.damage;
            screenShake = 7; sfx("hurt"); say("The ward bell is taking damage!");
          }
          enemy.state = "recover";
          enemy.stateClock = enemy.boss ? 0.65 : 0.9;
        }
        return;
      }

      if (distance < (targetsBell ? 46 : enemy.r + hero.r + 13)) {
        enemy.state = "telegraph";
        enemy.stateClock = enemy.boss ? 0.42 : 0.55;
        return;
      }

      if (distance < 210 || targetsBell) {
        enemy.state = "chase";
        moveEnemyAnimated(enemy, dx / distance * enemy.speed * dt, dy / distance * enemy.speed * dt);
      } else {
        enemy.state = "wander";
        moveEnemyAnimated(enemy, Math.sin(game.elapsed * 0.8 + enemy.seed) * 13 * dt, Math.cos(game.elapsed * 0.7 + enemy.seed) * 13 * dt);
      }
    }

    function updatePlatform(dt) {
      const p = game.platform;
      if (!p) return;
      game.elapsed += dt;
      const input = movementInput();
      if (Math.abs(input.x) > 0.05) p.facing = Math.sign(input.x);
      const targetVx = input.x * 170;
      const acceleration = p.grounded ? 1050 : 480;
      p.vx += clamp(targetVx - p.vx, -acceleration * dt, acceleration * dt);
      if (Math.abs(input.x) <= 0.05) {
        const drag = p.grounded ? 10 : 0.7;
        p.vx *= Math.max(0, 1 - drag * dt);
      }
      p.x = clamp(p.x + p.vx * dt, 20, SPIRIT_WORLD_W - 10);
      p.vy += 760 * dt;
      p.y += p.vy * dt;
      p.slash = Math.max(0, p.slash - dt);
      const ground = platformGroundAt(p.x);
      if (ground !== null && p.y >= ground - 18 && p.vy >= 0) {
        p.y = ground - 18; p.vy = 0; p.grounded = true;
      } else p.grounded = false;

      if (p.y > 610) {
        game.hero.hp -= 8;
        p.x = p.checkpoint; p.y = (platformGroundAt(p.checkpoint) || 500) - 18; p.vy = 0;
        sfx("hurt");
        say("The ravine mist returns Yusuke to the last shrine marker.");
        if (game.hero.hp <= 0) finish("defeat", "ravine");
      }

      p.camera += (clamp(p.x - 90, 0, SPIRIT_WORLD_W - W) - p.camera) * Math.min(1, dt * 6);
      for (const goon of p.goons) {
        if (goon.dead) continue;
        goon.cooldown = Math.max(0, goon.cooldown - dt);
        const goonGround = platformGroundAt(goon.x);
        if (goonGround !== null) goon.y = goonGround;
        const xDistance = Math.abs(p.x - goon.x);
        const sameLevel = Math.abs((p.y + 18) - goon.y) < (p.grounded ? 42 : 64);

        if (p.slash > 0 && xDistance < 60 && sameLevel && !goon.hitThisSlash) {
          goon.hitThisSlash = true;
          goon.hp -= 1;
          goon.x += Math.sign(goon.x - p.x || 1) * 12;
          burst(goon.x, goon.y - 20, "#fff2d0", 8);
          sfx("hit");
          if (goon.hp <= 0) {
            goon.dead = true;
            p.checkpoint = Math.max(p.checkpoint, goon.x - 50);
            game.mon += goon.thief ? 0 : 1;
            game.score += goon.thief ? 350 : 125;
            if (goon.thief) {
              setObjective("Clapper recovered • cross the far torii to return to the field");
              say("The clapper thief is beaten. Cross the far torii; the field shortcut is open.", 4);
            } else say("Path guard defeated • Mon +1");
          } else {
            say(`Thief staggered • ${goon.hp} hit${goon.hp === 1 ? "" : "s"} left`, 1.6);
          }
          continue;
        }
        if (p.slash <= 0) goon.hitThisSlash = false;

        if (goon.telegraph > 0) {
          goon.telegraph -= dt;
          if (goon.telegraph <= 0) {
            if (xDistance < 48 && sameLevel && game.hero.invulnerable <= 0) {
              game.hero.hp -= 9;
              game.hero.invulnerable = 0.9;
              p.vy = -135;
              p.x += Math.sign(p.x - goon.x || 1) * 30;
              screenShake = 5;
              sfx("hurt");
            }
            goon.cooldown = 1.05;
          }
          continue;
        }

        if (xDistance < 112 && sameLevel) {
          goon.dir = Math.sign(p.x - goon.x) || goon.dir;
          goon.x += goon.dir * 46 * dt;
          if (xDistance < 37 && goon.cooldown <= 0) goon.telegraph = 0.36;
        } else goon.x += goon.dir * 24 * dt;

        if (goon.x <= goon.left || goon.x >= goon.right) {
          goon.x = clamp(goon.x, goon.left, goon.right);
          goon.dir *= -1;
        }
      }
      game.hero.invulnerable = Math.max(0, game.hero.invulnerable - dt);
      if (game.hero.hp <= 0) {
        finish("defeat", "path");
        return;
      }
      const thief = p.goons.find(goon => goon.thief);
      if (p.x > 1278) {
        if (p.revisit) {
          if (p.goons.some(goon => !goon.dead)) {
            p.x = 1278;
            setObjective("Defeat every path guard before using the far torii");
          } else finishPlatformReplay();
        } else if (thief && !thief.dead) {
          p.x = 1278;
          setObjective("Defeat the clapper thief before leaving the Spirit Path");
        } else finishPlatformChase();
      }
    }

    function platformGroundAt(x) {
      for (const segment of SPIRIT_SEGMENTS) {
        if (x < segment.start || x > segment.end) continue;
        const progress = (x - segment.start) / Math.max(1, segment.end - segment.start);
        return segment.y0 + (segment.y1 - segment.y0) * progress;
      }
      return null;
    }

    function draw() {
      const shakeX = screenShake ? (Math.random() - 0.5) * screenShake : 0;
      const shakeY = screenShake ? (Math.random() - 0.5) * screenShake : 0;
      ctx.save();
      ctx.translate(shakeX, shakeY);
      if (game.scene === "title") drawTitle();
      else if (game.scene === "topdown") drawTopdown();
      else if (game.scene === "repair") drawRepair();
      else if (game.scene === "platform") drawPlatform();
      else if (game.scene === "shop") drawShop();
      else drawOutcome();
      ctx.restore();
      if (messageTime > 0 && game.scene !== "title" && game.scene !== "outcome") drawMessage();
      if (game.scene !== "title" && game.scene !== "outcome") drawMusicToggle();
    }

    function drawMusicToggle() {
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = "#11131bd9";
      ctx.strokeStyle = musicMuted ? "#8f7471" : "#c7a45b";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(musicButton.x, musicButton.y, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = musicMuted ? "#9b8581" : "#f0d58c";
      ctx.beginPath();
      ctx.moveTo(337, 175); ctx.lineTo(340, 175); ctx.lineTo(344, 171);
      ctx.lineTo(344, 183); ctx.lineTo(340, 179); ctx.lineTo(337, 179); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = musicMuted ? "#e08a80" : "#f0d58c";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      if (musicMuted) {
        ctx.moveTo(347, 174); ctx.lineTo(351, 180); ctx.moveTo(351, 174); ctx.lineTo(347, 180);
      } else {
        ctx.arc(344, 177, 4, -0.7, 0.7); ctx.arc(344, 177, 7, -0.6, 0.6);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawTitle() {
      if (titleBackdrop.complete && titleBackdrop.naturalWidth) {
        ctx.drawImage(titleBackdrop, 0, 0, titleBackdrop.naturalWidth, titleBackdrop.naturalHeight, 0, 0, W, H);
      } else {
        ctx.fillStyle = "#080a10";
        ctx.fillRect(0, 0, W, H);

      for (const node of game.nodes) if (node.active) drawNode(node);

      for (const enemy of game.enemies) drawEnemy(enemy);

    function drawBellYard() {
      ctx.fillStyle = "#c4b589";
      ctx.fillRect(bell.x - 56, bell.y - 126, 112, 134);

      drawBellGraphic(bell.x, bell.y, 0.72);
      drawInstalledBellRepairs();
      if (game.phase === "breach") {
        ctx.fillStyle = bell.integrity / bell.maxIntegrity > 0.5 ? "#efcb61" : "#ef6558";
        ctx.fillRect(bell.x - 37, bell.y + 46, 74 * clamp(bell.integrity / bell.maxIntegrity, 0, 1), 5);
      }

    function drawInstalledBellRepairs() {
      const hasRope = game.upgrades.includes("Braided Ward Rope");
      const hasClapper = game.upgrades.includes("Tempered Clapper");
      const hasTalismans = game.upgrades.includes("Gate Talismans");
      const hasKnot = game.upgrades.includes("Warrior's Knot");

      if (hasRope) {
        ctx.strokeStyle = "#eee1b3";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(bell.x - 47, bell.y - 78);
        ctx.quadraticCurveTo(bell.x, bell.y - 65, bell.x + 47, bell.y - 78);
        ctx.stroke();
        for (const offset of [-30, -10, 10, 30]) {
          ctx.fillStyle = "#f3ead0";
          ctx.beginPath();
          ctx.moveTo(bell.x + offset - 4, bell.y - 73);
          ctx.lineTo(bell.x + offset, bell.y - 62);
          ctx.lineTo(bell.x + offset + 4, bell.y - 73);
          ctx.fill();
        }
      }

      if (hasClapper) {
        ctx.fillStyle = "#f2ca61";
        ctx.fillRect(bell.x - 3, bell.y - 31, 6, 34);
        ctx.beginPath();
        ctx.arc(bell.x, bell.y + 5, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff1a1";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      if (hasTalismans) {
        for (const [x, y, tilt] of [[-43, -103, -0.1], [39, -103, 0.1], [-45, -20, 0.08], [41, -20, -0.08]]) {
          ctx.save();
          ctx.translate(bell.x + x, bell.y + y);
          ctx.rotate(tilt);
          ctx.fillStyle = "#f4e7bd";
          ctx.fillRect(-5, -11, 10, 22);
          ctx.fillStyle = "#b34d42";
          ctx.fillRect(-2, -8, 4, 3);
          ctx.fillRect(-1, -2, 2, 9);
          ctx.restore();
        }
      }

      if (hasKnot) {
        ctx.strokeStyle = "#b8403c";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(bell.x - 9, bell.y + 25, 8, 0, Math.PI * 2);
        ctx.arc(bell.x + 9, bell.y + 25, 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#d0584d";
        ctx.beginPath();
        ctx.moveTo(bell.x, bell.y + 28);
        ctx.lineTo(bell.x - 10, bell.y + 46);
        ctx.lineTo(bell.x, bell.y + 41);
        ctx.lineTo(bell.x + 10, bell.y + 46);
        ctx.closePath();
        ctx.fill();
      }

      if (game.upgrades.length) {
        ctx.fillStyle = "#1a1718d9";
        ctx.fillRect(bell.x - 39, bell.y + 12, 78, 15);
        ctx.strokeStyle = "#d3ae62";
        ctx.lineWidth = 1;
        ctx.strokeRect(bell.x - 38.5, bell.y + 12.5, 77, 14);
        text(`WARD ${game.upgrades.length}/2`, bell.x, bell.y + 20, 7, "#ffe4a0", "center", true);
      }
    }

    function drawBellOverlay() {
      if (game.phase !== "breach") return;
      const pulse = 24 + Math.sin(game.elapsed * 5) * 4 + bell.resonance * 0.08;
      ctx.save();
      ctx.globalAlpha = 0.18 + bell.resonance / 650;
      ctx.strokeStyle = "#f8d66d";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(bell.x, bell.y - 20, pulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = bell.integrity / bell.maxIntegrity > 0.5 ? "#efcb61" : "#ef6558";
      ctx.fillRect(bell.x - 37, bell.y + 46, 74 * clamp(bell.integrity / bell.maxIntegrity, 0, 1), 5);
    }

      ctx.fillRect(33, -54, 9, 92);
      ctx.fillRect(-48, -58, 96, 9);

    function drawForegroundRoof() {
      ctx.fillStyle = "#30282b";
      ctx.fillRect(0, 1120, W, 80);
      ctx.fillStyle = "#53615d";
      for (let x = -8; x < W; x += 24) {

      ctx.fillStyle = "#242126";

    function drawOfficial() {
      if (citizenWalkAtlas || citizenVerticalAtlas || citizenPortraitAtlas) {
        const baseline = official.y + 16;
        drawGroundShadow(official.x, baseline, 15);
        const dx = game.hero.x - official.x;
        const dy = game.hero.y - official.y;
        const sideApproach = Math.abs(dx) > 72 && Math.abs(dx) > Math.abs(dy) * 1.25;
        if (!sideApproach && citizenVerticalAtlas) {
          drawCitizenVerticalCell(0, dy >= 0 ? 0 : 2, official.x, baseline, 62);
        } else if (!sideApproach && citizenPortraitAtlas && dy >= 0) {
          drawCitizenPortraitCell(0, 0, official.x, baseline, 62);
        } else {
          drawCitizenWalkCell(0, 0, official.x, baseline, 62, dx < 0);
        }
        return;
      }
      ctx.fillStyle = "#3b384b";
      ctx.fillRect(official.x - 10, official.y - 13, 20, 27);
      ctx.fillStyle = "#e4b887";
      ctx.fillRect(official.x - 7, official.y - 22, 14, 10);
      ctx.fillStyle = "#27252b";
      ctx.fillRect(official.x - 9, official.y - 26, 18, 5);
      ctx.fillStyle = "#f2d06d";
      ctx.fillRect(official.x - 2, official.y - 8, 4, 13);
    }

    function drawTownResidents() {
      if (!citizenWalkAtlas) return;
      for (const person of game.residents) {
        const baseline = person.y + 16;
        const frame = person.moving ? Math.floor((person.walkClock || 0) * 2) % 2 : 0;
        drawGroundShadow(person.x, baseline, 14);
        if (person.axis === "y" && citizenVerticalAtlas) {
          const directionRow = person.dir > 0 ? frame : 2 + frame;
          drawCitizenVerticalCell(person.column, directionRow, person.x, baseline, 58);
        } else {
          drawCitizenWalkCell(person.column, frame, person.x, baseline, 58, person.dir < 0);
        }
      }
    }

    function drawNode(node) {
      const bob = Math.sin(game.elapsed * 3 + node.pulse) * 2;
      ctx.save();
      ctx.translate(node.x, node.y + bob);
      ctx.strokeStyle = "#3f3027"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-10, 6); ctx.lineTo(8, -8); ctx.moveTo(-7, 10); ctx.lineTo(12, -4); ctx.stroke();
      ctx.strokeStyle = "#8f6540"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-10, 6); ctx.lineTo(8, -8); ctx.moveTo(-7, 10); ctx.lineTo(12, -4); ctx.stroke();
      ctx.strokeStyle = "#d6bd62"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-4, -1); ctx.lineTo(5, 7); ctx.stroke();
      ctx.fillStyle = "#718353";
      ctx.fillRect(5, -13, 4, 10); ctx.fillRect(9, -11, 7, 3); ctx.fillRect(2, -9, 7, 3);
      ctx.globalAlpha = 0.45 + Math.sin(game.elapsed * 4 + node.pulse) * 0.15;
      ctx.strokeStyle = "#f0d876"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    function drawHero(hero) {
      if (hero.invulnerable > 0 && Math.floor(hero.invulnerable * 16) % 2) return;
      drawHeroUpgradeEffects(hero);
      if (heroSheet.complete && heroSheet.naturalWidth) {
        let column;
        if (Math.abs(hero.facingX) > Math.abs(hero.facingY)) column = hero.facingX < 0 ? 1 : 2;
        else column = hero.facingY > 0 ? 0 : 3;
        let row = hero.moving && Math.floor(game.elapsed * 7) % 2 ? 1 : 0;
        let flip = false;
        let attackLunge = 0;
        if (hero.attackFx > 0) {
          if (Math.abs(hero.facingY) >= Math.abs(hero.facingX)) {
            row = 0;
            column = hero.facingY < 0 ? 3 : 0;
            const slashProgress = 1 - clamp(hero.attackFx / 0.24, 0, 1);
            attackLunge = Math.sin(slashProgress * Math.PI) * (hero.facingY < 0 ? -4 : 4);
          } else {
            row = 2;
            if (hero.facingX < -0.25) { column = 1; flip = true; }
            else if (hero.facingX > 0.25) column = 1;
            else column = 0;
          }
        }
        drawHeroCell(column, row, hero.x, hero.y + 15 + attackLunge, 68, flip);

    function drawHeroUpgradeEffects(hero) {
      const foxSmokeActive = game.smokeCharm || ((game.phase === "run1" || game.phase === "run2") && game.runFogMod < 1);

        for (let i = 0; i < 3; i++) {

    function drawVerticalSlashFx(hero) {
      const north = hero.facingY < 0;
      const progress = 1 - clamp(hero.attackFx / 0.24, 0, 1);
      const centerY = hero.y + (north ? -8 : 5);
      const base = north ? -Math.PI / 2 : Math.PI / 2;
      const sweep = -1.2 + progress * 2.35;
      ctx.save();
      ctx.translate(hero.x, centerY);
      ctx.globalAlpha = 0.9 - progress * 0.22;
      ctx.strokeStyle = "#fff7d9";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(0, 0, 31, base + sweep - 0.58, base + sweep + 0.58);
      ctx.stroke();
      ctx.strokeStyle = "#d8aa4e";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 35, base + sweep - 0.42, base + sweep + 0.5);
      ctx.stroke();
      ctx.rotate(base + sweep);
      ctx.strokeStyle = "#201a1b"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(16, 0); ctx.stroke();
      ctx.strokeStyle = "#e0b650"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(14, -5); ctx.lineTo(14, 5); ctx.stroke();
      ctx.strokeStyle = "#fff9e7"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(17, 0); ctx.lineTo(43, 0); ctx.stroke();
      ctx.strokeStyle = "#a8c4c8"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(18, -1); ctx.lineTo(43, -1); ctx.stroke();
      ctx.restore();
    }

    function drawHeroCell(column, row, x, baseline, size, flip = false) {
      if (!heroSheet.complete || !heroSheet.naturalWidth) return;
      const sourceWidth = heroSheet.naturalWidth / 4;
      const sourceHeight = heroSheet.naturalHeight / 4;
      const footRatios = [
        [0.923, 0.958, 0.958, 0.939],
        [0.900, 0.871, 0.875, 0.891],
        [0.794, 0.781, 0.790, 0.788],
        [0.807, 0.801, 0.801, 0.801]
      ];
      const drawY = baseline - size * footRatios[row][column];
      // The generated front/back cells sit at different horizontal positions
      // inside their source boxes. Cancel that baked offset so changing only
      // vertical direction never appears to move Yusuke sideways.
      const verticalOpticalOffset = row < 2
        ? (column === 0 ? 30 : column === 3 ? -39 : 0)
        : 0;
      const drawX = -size / 2 - verticalOpticalOffset * size / sourceWidth;
      ctx.save();
      ctx.translate(x, 0);
      if (flip) ctx.scale(-1, 1);
      ctx.drawImage(
        heroSheet,
        column * sourceWidth, row * sourceHeight, sourceWidth, sourceHeight,
        drawX, drawY, size, size
      );
      ctx.restore();

    function drawEnemy(enemy) {
      if (enemy.dead && enemy.flash < -0.12) return;
      if (enemy.type === "bandit") {
        if (!banditWalkAtlas) return;
        const baseline = enemy.y + 16;
        const walkFrame = Math.floor(game.elapsed * 8) % 2;
        drawGroundShadow(enemy.x, baseline, 15);
        drawBanditWalkCell(3, walkFrame, enemy.x, baseline, 66, enemy.state !== "escapeTown" && game.hero.x < enemy.x);
        ctx.save();
        ctx.translate(enemy.x, enemy.y - 7);
        ctx.strokeStyle = enemy.flash > 0 ? "#fff5d7" : "#de574e";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(0, 13, 22, 8, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "#de574e";
        ctx.beginPath(); ctx.moveTo(0, -35); ctx.lineTo(-7, -47); ctx.lineTo(7, -47); ctx.closePath(); ctx.fill();
        ctx.restore();
        if (enemy.hp < enemy.maxHp) {

          ctx.fillStyle = "#ef695c";
          ctx.fillRect(enemy.x - 18, enemy.y - 60, 36 * enemy.hp / enemy.maxHp, 4);
        }
        return;
      }
      const moving = enemy.state === "chase" || enemy.state === "wander";
      const walkFrame = Math.floor((enemy.animDistance || 0) / 9) % 2;
      const pose = enemy.state === "telegraph" ? 2 : moving ? walkFrame : 0;
      const facingLeft = enemy.facingX ? enemy.facingX < 0 : game.hero.x < enemy.x;
      let generated = false;
      if (enemy.type === "wisp") generated = drawYokaiCell(0, pose, enemy.x, enemy.y + 24, 96, facingLeft, enemy.flash > 0);
      else if (enemy.type === "prowler") generated = drawYokaiCell(1, pose, enemy.x, enemy.y + 27, 104, facingLeft, enemy.flash > 0);
      else if (enemy.type === "raider") generated = drawYokaiCell(2, pose, enemy.x, enemy.y + 27, 110, facingLeft, enemy.flash > 0);
      else if (enemy.type === "boss") generated = drawYokaiCell(3, pose, enemy.x, enemy.y + 34, 138, facingLeft, enemy.flash > 0);
      if (!generated && enemy.type === "boss") drawOniEnemy(enemy);
      else if (!generated && enemy.type === "wisp") drawWispEnemy(enemy);
      else if (!generated && (enemy.type === "prowler" || enemy.type === "raider")) drawProwlerEnemy(enemy);
      if (enemy.hp < enemy.maxHp) {
        ctx.fillStyle = "#2b2024";
        ctx.fillRect(enemy.x - enemy.r, enemy.y - enemy.r - 15, enemy.r * 2, 3);
        ctx.fillStyle = "#ef695c";
        ctx.fillRect(enemy.x - enemy.r, enemy.y - enemy.r - 15, enemy.r * 2 * enemy.hp / enemy.maxHp, 3);

    function chamferedPanelPath(x, y, width, height, cut = 5) {
      ctx.beginPath();
      ctx.moveTo(x + cut, y);
      ctx.lineTo(x + width - cut, y);
      ctx.lineTo(x + width, y + cut);
      ctx.lineTo(x + width, y + height - cut);
      ctx.lineTo(x + width - cut, y + height);
      ctx.lineTo(x + cut, y + height);
      ctx.lineTo(x, y + height - cut);
      ctx.lineTo(x, y + cut);
      ctx.closePath();
    }

      chamferedPanelPath(x, y, width, height, 6); ctx.fill();

      ctx.fillStyle = "#0d141aeF";
      chamferedPanelPath(x + 4, y + 4, width - 8, height - 8, 3); ctx.fill();
      ctx.fillStyle = "#8e3835"; ctx.fillRect(x + 13, y + 5, Math.min(54, width - 26), 2);

        ctx.fillStyle = "#e2bd70";

      chamferedPanelPath(106.5, 7.5, 245, 69, 5); ctx.stroke();
      chamferedPanelPath(106.5, 82.5, 245, 37, 5); ctx.stroke();
