<!doctype html><html lang="en"><meta charset="utf-8"><title>Enemy matte cleanup</title>
<style>body{background:#141722;color:#eee;font:16px system-ui;margin:20px}canvas{width:100%;max-width:1100px;display:block;image-rendering:pixelated;background:#403051}h1{font-size:22px}button{padding:10px;margin:10px}pre{font-size:12px;white-space:pre-wrap}h2{font-size:18px}</style>
<h1>Enemy matte cleanup</h1><p id="status">Loading sprites…</p><h2>Exported game sheets — animation check</h2><canvas id="animation" width="720" height="260"></canvas><main></main>
<script src="enemy-cleanup.js?v=4"></script><script>
(async()=>{
 const load=async src=>{const i=new Image();i.src=src;await i.decode();return i;};
 const background=await load('../assets/environment/spirit-path-platform-v2.png');
 for(const [kind,file,cols] of [['bandits','spirit-path-enemies-v1.png',3],['demons','edo-yokai-atlas-v3.png',4],['town-bandits','edo-citizens-walk-v1.png',6]]){
  const original=await load('../assets/characters/'+file);
  const {canvas:clean,regions,fringe}=cleanEnemyAtlas(original,kind);
  const heading=document.createElement('h2'); heading.textContent=kind+' — fringe pixels corrected: '+fringe;document.querySelector('main').append(heading);
  const button=document.createElement('button');button.textContent='Download '+kind+' transparent PNG';document.querySelector('main').append(button);
  button.onclick=()=>clean.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=kind+'-clean.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
  const view=document.createElement('canvas');view.width=original.width;view.height=original.height;
  const c=view.getContext('2d');c.drawImage(background,0,0,view.width,view.height);c.drawImage(clean,0,0);document.querySelector('main').append(view);
  const details=document.createElement('details');details.innerHTML='<summary>Enclosed white-region audit</summary>';
  const pre=document.createElement('pre');pre.textContent=JSON.stringify(regions,null,1);details.append(pre);document.querySelector('main').append(details);
 }
 document.getElementById('status').textContent='All three sheets loaded. Open the white-region audit to inspect retained highlights and removed pockets.';
 const [path, demons, town] = await Promise.all([
  load('../assets/characters/spirit-path-enemies-v2-clean.png'),
  load('../assets/characters/edo-yokai-atlas-v4-clean.png'),
  load('../assets/characters/edo-citizens-walk-v2-clean.png')
 ]);
 const animation=document.getElementById('animation'), c=animation.getContext('2d');
 function draw(time){
  c.imageSmoothingEnabled=false;c.drawImage(background,0,0,720,260);
  const row=Math.floor(time/400)%3;
  for(let col=0;col<3;col++) c.drawImage(path,col*418,row*418,418,418,40+col*120,120-78*[.957,.830,.663][row],78,78);
  const townRow=row%2, tw=town.width/6,th=town.height/2;
  c.drawImage(town,3*tw+2,townRow*th+2,tw-4,th-4,430,120-66*(townRow===0?.89:.78),66,66);
  const feet=[[.91,.94,.97,.97],[.85,.83,.83,.82],[.67,.64,.67,.70]];
  for(let col=0;col<4;col++){
    const ch=Math.floor(demons.height/3),size=col===3?138:104;
    c.drawImage(demons,col*384+2,row*ch+2,380,ch-4,40+col*160,252-size*feet[row][col],size,size);
  }
  requestAnimationFrame(draw);
 }
 requestAnimationFrame(draw);
})().catch(e=>document.getElementById('status').textContent=e.message);
</script></html>
